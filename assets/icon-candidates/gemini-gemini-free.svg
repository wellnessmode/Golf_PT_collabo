<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Dark Tech Slate Gradient Background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B101D"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>

    <!-- Ambient Mint Glow behind Symbol -->
    <radialGradient id="ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D29A" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#00D29A" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00D29A" stop-opacity="0"/>
    </radialGradient>

    <!-- Silver-Platinum Metallic Gradient for Vertical Bars -->
    <linearGradient id="silver-bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#C8D2DD"/>
    </linearGradient>

    <!-- Signature Mint Accent Gradient -->
    <linearGradient id="mint-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFB2"/>
      <stop offset="60%" stop-color="#00D29A"/>
      <stop offset="100%" stop-color="#00B884"/>
    </linearGradient>

    <!-- Bright Platinum-White Ball Faces -->
    <linearGradient id="ball-face-upper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="ball-face-lower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Soft Radial Highlight for Upper-Left Ball Face -->
    <radialGradient id="ball-highlight" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Drop Shadow for Full Symbol -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <!-- Crisp Mint Glow for Diagonal & Ring -->
    <filter id="mint-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00FFB2" flood-opacity="0.30"/>
    </filter>

    <!-- Ball Inner Mask/Clip (Radius 104 around center 680, 665) -->
    <clipPath id="ball-clip">
      <circle cx="680" cy="665" r="104"/>
    </clipPath>
  </defs>

  <!-- 1. Full Square Background (OS Masks Corners) -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg-grad)"/>

  <!-- Ambient Mint Backlight -->
  <circle cx="512" cy="512" r="410" fill="url(#ambient-glow)"/>

  <!-- Main Symbol Group with Depth Shadow -->
  <g filter="url(#shadow)">

    <!-- Vertical Platinum Bars (44px wide, sharp square ends) -->
    <!-- Bar 1 (Full Height) -->
    <rect x="212" y="236" width="44" height="534" fill="url(#silver-bar)"/>

    <!-- Bar 2 (Platinum Stem cut below diagonal with uniform 8px gap) -->
    <path d="M 290 320.85 L 334 364.85 V 770 H 290 Z" fill="url(#silver-bar)"/>

    <!-- Bar 3 (Hanging Stub under diagonal with uniform 8px gap) -->
    <path d="M 367 397.85 L 411 441.85 V 770 H 367 Z" fill="url(#silver-bar)"/>

    <!-- Bar 4 (Top bar ending above diagonal with uniform 8px gap) -->
    <path d="M 573 236 H 617 V 551.69 L 573 507.69 Z" fill="url(#silver-bar)"/>

    <!-- Bar 5 (Bottom curved around ball at R=142) -->
    <path d="M 653 236 H 697 V 524 A 142 142 0 0 0 653 525.6 Z" fill="url(#silver-bar)"/>

    <!-- Bar 6 (Bottom curved around ball at R=142) -->
    <path d="M 727 236 H 771 V 556 A 142 142 0 0 0 727 531 Z" fill="url(#silver-bar)"/>

    <!-- N-Diagonal Swing Path & Ball Outer Ring (Mint Accent) -->
    <g filter="url(#mint-glow)">
      <!-- Mint Diagonal Swing Path (Strengthened 52px perpendicular width) -->
      <path d="M 290 236 L 625 571 L 635 654.54 L 290 309.54 Z" fill="url(#mint-grad)"/>

      <!-- Golf Ball Outer Ring (24px thick stroke) -->
      <circle cx="680" cy="665" r="116" fill="none" stroke="url(#mint-grad)" stroke-width="24"/>
    </g>

    <!-- Golf Ball Core (Inside Ring Inner Radius 104) -->
    <g>
      <!-- Rotated Ball Core: Corrected S-Seam and Faces rotated -30° -->
      <g transform="rotate(-30 680 665)">
        <!-- Upper Platinum-White Face -->
        <path d="M 576 665 A 52 52 0 0 0 680 665 A 52 52 0 0 1 784 665 A 104 104 0 0 0 576 665 Z" fill="url(#ball-face-upper)"/>

        <!-- Lower Platinum-White Face -->
        <path d="M 576 665 A 52 52 0 0 0 680 665 A 52 52 0 0 1 784 665 A 104 104 0 0 1 576 665 Z" fill="url(#ball-face-lower)"/>

        <!-- Signature Mint S-Seam Band (22px thick, entering at 8 o'clock and exiting at 2 o'clock) -->
        <path d="M 576 665 A 52 52 0 0 0 680 665 A 52 52 0 0 1 784 665" fill="none" stroke="url(#mint-grad)" stroke-width="22" clip-path="url(#ball-clip)"/>
      </g>

      <!-- Smooth Surface Reflection Accent (Unrotated Upper-Left Light Source) -->
      <circle cx="680" cy="665" r="104" fill="url(#ball-highlight)" clip-path="url(#ball-clip)"/>
    </g>

  </g>
</svg>