<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    NATIONAL GYM PT & GOLF - app icon, candidate "mark-mono" v2, plain golf ball variant
    Lettermark  I I N | | |  rebuilt for icon scale:
      bar 50 / gap 48 (3.1px / 3px at 64px), N diagonal at 48.9deg aimed at the ball centre,
      right bars + diagonal cut by a 12px dark ring around the ball (bars "rest on" the ball).
    Ball: white sphere, plain dimpled golf ball (no swoosh),
      mint rim light + halo as the single accent. Safe zone: all mark corners <= 401px from centre.
  -->
  <defs>
    <!-- ===== background ===== -->
    <radialGradient id="bg" cx="360" cy="330" r="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b343d"/>
      <stop offset="0.5" stop-color="#171d23"/>
      <stop offset="1" stop-color="#0a0d10"/>
    </radialGradient>
    <radialGradient id="vig" cx="512" cy="512" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.62"/>
    </radialGradient>
    <!-- diagonal light shafts, gradient runs across the (rotated) rect -->
    <linearGradient id="shaftA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shaftB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shaftLum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.5" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="shaftmask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect x="-500" y="200" width="2024" height="520" fill="url(#shaftLum)" transform="rotate(48.93 512 512)"/>
    </mask>
    <!-- mint energy: halo around the ball + wash in the lower-right corner -->
    <radialGradient id="halo" cx="685" cy="632" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0.40" stop-color="#00d29a" stop-opacity="0.42"/>
      <stop offset="0.62" stop-color="#00d29a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#00d29a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cornerwash" cx="990" cy="980" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00d29a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00d29a" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    </filter>
    <filter id="softblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <!-- ===== lettermark ===== -->
    <linearGradient id="ink" x1="0" y1="242" x2="0" y2="782" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dfe5"/>
    </linearGradient>
    <filter id="markshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <!-- everything of the mark except a 162px disc around the ball (12px dark ring gap) -->
    <mask id="ringcut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="685" cy="632" r="162" fill="#000"/>
    </mask>

    <!-- ===== ball ===== -->
    <radialGradient id="ballbase" cx="638" cy="582" r="198" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#f3f6f8"/>
      <stop offset="0.8" stop-color="#d7dde3"/>
      <stop offset="1" stop-color="#b3bcc6"/>
    </radialGradient>
    <!-- broad mint tint on the shadow side (lower-right lobe) -->
    <radialGradient id="minttint" cx="600" cy="548" r="252" gradientUnits="userSpaceOnUse">
      <stop offset="0.66" stop-color="#00d29a" stop-opacity="0"/>
      <stop offset="0.88" stop-color="#00d29a" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#00d29a" stop-opacity="0.50"/>
    </radialGradient>
    <!-- the logo's ring, in the accent: deeper mint upper-left, lit mint lower-right -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00a97c"/>
      <stop offset="0.5" stop-color="#00d29a"/>
      <stop offset="1" stop-color="#5dffd0"/>
    </linearGradient>
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dimples" width="24" height="41.57" patternUnits="userSpaceOnUse" patternTransform="translate(685 632)">
      <circle cx="6" cy="6" r="5.2" fill="#1a2a33" fill-opacity="0.13"/>
      <circle cx="6.9" cy="7.1" r="3.6" fill="#ffffff" fill-opacity="0.32"/>
      <circle cx="18" cy="26.78" r="5.2" fill="#1a2a33" fill-opacity="0.13"/>
      <circle cx="18.9" cy="27.88" r="3.6" fill="#ffffff" fill-opacity="0.32"/>
    </pattern>
    <!-- dimples fade out under the specular highlight -->
    <radialGradient id="dimpleLum" cx="632" cy="574" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.22" stop-color="#000"/>
      <stop offset="0.75" stop-color="#fff"/>
    </radialGradient>
    <mask id="dimplemask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <circle cx="685" cy="632" r="150" fill="url(#dimpleLum)"/>
    </mask>
    <clipPath id="ballclip"><circle cx="685" cy="632" r="150"/></clipPath>
    <clipPath id="innerclip"><circle cx="685" cy="632" r="137.5"/></clipPath>
    <filter id="ballshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- ===== background ===== -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- light shafts parallel to the N diagonal (48.93deg) -->
  <g transform="rotate(48.93 512 512)">
    <rect x="-500" y="190" width="2024" height="480" fill="url(#shaftA)"/>
    <rect x="-500" y="340" width="2024" height="120" fill="url(#shaftB)"/>
  </g>
  <!-- fine brushed hairlines inside the shaft -->
  <g mask="url(#shaftmask)" transform="rotate(48.93 512 512)" stroke="#fff" stroke-opacity="0.07" stroke-width="1.2">
    <path d="M-500,250H1524M-500,282H1524M-500,314H1524M-500,346H1524M-500,378H1524M-500,410H1524M-500,442H1524M-500,474H1524M-500,506H1524M-500,538H1524M-500,570H1524M-500,602H1524M-500,634H1524M-500,666H1524"/>
  </g>
  <rect width="1024" height="1024" fill="url(#cornerwash)"/>
  <rect width="1024" height="1024" fill="url(#vig)"/>
  <rect width="1024" height="1024" filter="url(#grain)"/>
  <!-- mint halo behind the ball -->
  <circle cx="685" cy="632" r="340" fill="url(#halo)"/>
  <!-- contact shadow of the ball, drawn under the bars so ball and bars read as one plane -->
  <circle cx="687" cy="648" r="152" fill="#000" fill-opacity="0.5" filter="url(#ballshadow)"/>

  <!-- ===== lettermark: I I N | | | ===== -->
  <g mask="url(#ringcut)">
    <g fill="url(#ink)" filter="url(#markshadow)">
      <!-- left bars -->
      <rect x="216" y="242" width="50" height="540"/>
      <rect x="314" y="242" width="50" height="540"/>
      <!-- third bar tucked under the diagonal (top hidden by it) -->
      <rect x="412" y="340" width="50" height="442"/>
      <!-- N diagonal: springs from bar 2's top, aims at the ball centre, cut by the ring -->
      <polygon points="314,242 380.4,242 796.9,720 730.5,720"/>
      <!-- right bars, cut by the ring -->
      <rect x="562" y="242" width="50" height="398"/>
      <rect x="660" y="242" width="50" height="398"/>
      <rect x="758" y="242" width="50" height="398"/>
    </g>
  </g>

  <!-- ===== golf ball ===== -->
  <circle cx="685" cy="632" r="150" fill="url(#ballbase)"/>
  <g clip-path="url(#innerclip)">
    <!-- dimples -->
    <g mask="url(#dimplemask)"><circle cx="685" cy="632" r="150" fill="url(#dimples)"/></g>
    <!-- mint shadow-side tint -->
    <circle cx="685" cy="632" r="150" fill="url(#minttint)" opacity="0.7"/>
    <!-- specular -->
    <ellipse cx="632" cy="574" rx="66" ry="46" fill="url(#spec)" transform="rotate(-38 632 574)"/>
    <!-- inner shade where the ring meets the sphere -->
    <circle cx="685" cy="632" r="137.5" fill="none" stroke="#000" stroke-opacity="0.16" stroke-width="6"/>
  </g>
  <!-- mint ring (outer edge = r150) -->
  <circle cx="685" cy="632" r="143.5" fill="none" stroke="url(#ring)" stroke-width="13"/>
  <circle cx="685" cy="632" r="149" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="2"/>
</svg>
