<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <style>
    text{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif}
  </style>
  <g fill="#1a1a1a">
    <!-- I vertical bars -->
    <rect x="5" y="8" width="5.5" height="52" rx="0.5"/>
    <rect x="15" y="8" width="5.5" height="52" rx="0.5"/>
    <!-- N diagonal -->
    <rect x="26" y="8" width="5.5" height="52" rx="0.5"/>
    <polygon points="31.5,8 56,52 56,60 50.5,60 50.5,18 26,60 26,52"/>
    <rect x="50.5" y="8" width="5.5" height="52" rx="0.5"/>
    <!-- Golf ball -->
    <circle cx="42" cy="78" r="15" fill="none" stroke="#1a1a1a" stroke-width="4.5"/>
    <path d="M34,75 Q42,69 50,75" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
    <path d="M34,81 Q42,87 50,81" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- NATIONAL -->
  <text x="76" y="36" font-size="30" font-weight="900" fill="#1a1a1a" letter-spacing="3">NATIONAL</text>
  <!-- GYM -->
  <text x="76" y="68" font-size="30" font-weight="900" fill="#1a1a1a" letter-spacing="3">GYM</text>
  <!-- PT & GOLF -->
  <text x="157" y="52" font-size="9" font-weight="700" fill="#444" letter-spacing="1.5">PT &amp; GOLF</text>
  <!-- TRAINING STUDIO -->
  <text x="157" y="64" font-size="9" font-weight="700" fill="#444" letter-spacing="1.5">TRAINING STUDIO</text>
  <!-- Divider line -->
  <line x1="157" y1="76" x2="330" y2="76" stroke="#1a1a1a" stroke-width="1.8"/>
  <!-- 내 셔 널 짐 -->
  <text x="240" y="91" font-size="13" font-weight="600" fill="#1a1a1a" letter-spacing="8">내셔널짐</text>
</svg>
