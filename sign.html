<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전자계약서 서명 · 내셔널짐</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="container">
<header class="brand">
  <h1>전자계약서</h1>
  <p class="muted">아래 약관과 계약 내용을 확인하신 뒤 서명해 주세요.</p>
</header>

<div id="loading" class="card muted">불러오는 중...</div>

<div id="app" style="display:none">

  <div class="card">
    <h2>계약 내용</h2>
    <div id="contract-summary"></div>
  </div>

  <div class="card">
    <h2 id="terms-title">약관 전문</h2>
    <div class="terms" id="terms-body"></div>
    <p class="muted small" id="terms-meta"></p>
  </div>

  <div class="card">
    <h2>동의 사항</h2>
    <p class="muted small">필수 항목은 모두 체크해 주셔야 서명이 가능합니다.</p>
    <div id="agreements"></div>
  </div>

  <div class="card">
    <h2>본인 서명</h2>
    <p class="muted small">아래 박스에 손가락 또는 마우스로 서명해 주세요.</p>
    <div class="sig-wrap">
      <canvas id="sig"></canvas>
      <div class="sig-hint" id="sig-hint">여기에 서명</div>
    </div>
    <p><button class="secondary" id="sig-clear">다시 그리기</button></p>
  </div>

  <p>
    <button id="submit">동의하고 서명 제출</button>
  </p>
  <p class="error" id="err"></p>
</div>

<div id="done" class="card" style="display:none">
  <h2 class="ok">서명이 완료되었습니다.</h2>
  <p>완료된 계약서를 아래에서 확인·저장하실 수 있습니다.</p>
  <p><a id="view-link" class="btn">계약서 보기</a></p>
  <p class="muted small">본 계약서는 센터에 영구 보관되며, 분쟁 발생 시 증빙으로 활용됩니다.</p>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4/dist/signature_pad.umd.min.js"></script>
<script src="./config.js"></script>
<script src="./js/supabase.js"></script>
<script src="./js/sign.js"></script>
</body>
</html>
