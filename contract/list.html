<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>계약 목록 · 내셔널짐</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="container">
<header class="brand">
  <div class="flex-between">
    <h1>계약 목록</h1>
    <div class="toolbar"><a href="./admin.html" class="btn">새 계약 발송</a></div>
  </div>
  <p class="muted">발송된 계약의 상태를 조회·관리합니다.</p>
</header>

<div id="login" class="card" style="display:none">
  <h2>관리자 로그인</h2>
  <label>이메일 <input id="login-email" type="email"></label>
  <label>비밀번호 <input id="login-pw" type="password"></label>
  <p><button id="btn-login">로그인</button></p>
  <p class="error" id="login-err"></p>
</div>

<div id="app" style="display:none">
  <div class="card">
    <div class="row">
      <input id="q" type="text" placeholder="이름 / 휴대폰 검색">
      <select id="filter-status">
        <option value="">전체 상태</option>
        <option value="pending">대기</option>
        <option value="sent">발송</option>
        <option value="viewed">열람</option>
        <option value="signed">서명완료</option>
        <option value="expired">만료</option>
        <option value="canceled">취소</option>
      </select>
      <select id="filter-branch">
        <option value="">전체 지점</option>
      </select>
    </div>
    <div class="toolbar"><span class="muted small" id="count"></span></div>
    <div style="overflow-x:auto">
      <table class="data" id="tbl">
        <thead><tr>
          <th>회원</th><th>휴대폰</th><th>지점</th><th>금액</th>
          <th>상태</th><th>생성일</th><th></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./js/supabase.js"></script>
<script src="./js/list.js"></script>
</body>
</html>
