<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>계약서 발송 · 내셔널짐</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="container">
<header class="brand">
  <div class="flex-between">
    <h1>전자계약서 발송</h1>
    <div class="toolbar"><a href="./list.html" class="btn secondary">계약 목록</a></div>
  </div>
  <p class="muted">회원 정보·항목·금액 입력 후 서명 링크를 생성하여 카카오톡으로 안내합니다.</p>
</header>

<!-- Login -->
<div id="login" class="card" style="display:none">
  <h2>관리자 로그인</h2>
  <p class="muted">Supabase Auth 에 등록된 관리자 계정으로 로그인하세요.</p>
  <label>이메일 <input id="login-email" type="email" autocomplete="username"></label>
  <label>비밀번호 <input id="login-pw" type="password" autocomplete="current-password"></label>
  <p><button id="btn-login">로그인</button></p>
  <p class="error" id="login-err"></p>
</div>

<!-- App -->
<div id="app" style="display:none">
  <div class="flex-between toolbar">
    <span class="muted" id="who"></span>
    <button class="secondary" id="btn-logout">로그아웃</button>
  </div>

  <div class="card">
    <h2>1. 약관 / 지점</h2>
    <div class="row">
      <label>약관 종류
        <select id="t-type">
          <option value="combo">PT + 골프 통합</option>
          <option value="pt">PT 단독</option>
          <option value="golf">골프 단독</option>
        </select>
      </label>
      <label>지점
        <select id="branch"></select>
      </label>
    </div>
    <p class="muted small" id="tpl-info">활성 약관 정보가 표시됩니다.</p>
  </div>

  <div class="card">
    <h2>2. 회원 정보</h2>
    <div class="row">
      <label>이름 <input id="m-name" type="text" required></label>
      <label>휴대폰 <input id="m-phone" type="tel" placeholder="01012345678" required></label>
    </div>
    <div class="row">
      <label>생년월일 <input id="m-birth" type="date"></label>
      <label>이메일 (선택) <input id="m-email" type="email"></label>
    </div>
    <label>주소 (선택) <input id="m-address" type="text"></label>
  </div>

  <div class="card">
    <h2>3. 계약 항목</h2>
    <div id="items"></div>
    <p><button class="secondary" id="btn-add-item">+ 항목 추가</button></p>

    <div class="row">
      <label>총 결제금액 (원) <input id="total" type="number" min="0" step="1000"></label>
      <label>결제수단
        <select id="pay">
          <option value="card">카드</option>
          <option value="cash">현금</option>
          <option value="seoul_pay">서울페이</option>
          <option value="transfer">계좌이체</option>
          <option value="other">기타</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label>이용 시작일 <input id="period-start" type="date"></label>
      <label>이용 종료일 <input id="period-end" type="date"></label>
    </div>
    <div class="row">
      <label>사물함 번호 (선택) <input id="locker-no" type="text"></label>
      <label>사물함 개월 (선택) <input id="locker-months" type="number" min="0" step="1"></label>
    </div>
    <label>서비스 / 비고 (선택) <textarea id="notes" placeholder="사은품, 별도 안내사항 등"></textarea></label>
  </div>

  <div class="card">
    <h2>4. 발송</h2>
    <label>링크 만료 (일) <input id="expire-days" type="number" min="1" max="60" value="7"></label>
    <p>
      <button id="btn-create">서명 링크 생성</button>
      <button id="btn-reset" class="secondary">입력 초기화</button>
    </p>
    <p class="error" id="err"></p>
    <div id="result" style="display:none">
      <hr>
      <h3>서명 링크</h3>
      <input id="sign-url" type="text" readonly onclick="this.select()">
      <p><button class="secondary" id="btn-copy-url">링크 복사</button></p>
      <h3>카카오톡 발송 메시지 (복사 후 붙여넣기)</h3>
      <textarea id="kakao-msg" rows="10" readonly onclick="this.select()"></textarea>
      <p>
        <button class="secondary" id="btn-copy-msg">메시지 복사</button>
        <a id="kakao-share" class="btn secondary" target="_blank" rel="noopener" style="display:none">카카오톡 열기</a>
      </p>
      <p class="ok">계약 상태는 자동으로 '발송'으로 표시됩니다. 회원이 링크를 열람하면 '열람'으로, 서명하면 '서명완료'로 갱신됩니다.</p>
    </div>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./js/supabase.js"></script>
<script src="./js/admin.js"></script>
</body>
</html>
