<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1f17">
<meta name="robots" content="noindex, nofollow">
<title>성과 리포트</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ac:#00b884;--ac2:#00d29a;--pro:#3f7bff;--amber:#f0a13a;
  --tx:#0d1114;--tx2:#454c55;--tx3:#8b93a0;--bg:#f2f4f6;--card:#fff;--brd:rgba(13,20,28,.07);
  --r:18px;--shadow:0 2px 14px rgba(10,20,30,.06)}
html{-webkit-text-size-adjust:100%;font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Pretendard','Noto Sans KR',sans-serif;
  background:var(--bg);color:var(--tx);line-height:1.65;-webkit-font-smoothing:antialiased}
.report{max-width:560px;margin:0 auto;padding-bottom:70px}
/* ── 히어로 헤더 (GDR 앱 스타일 다크 그린) ── */
.hero{background:linear-gradient(158deg,#0b241a 0%,#0b1f17 46%,#081410 100%);color:#fff;
  padding:calc(env(safe-area-inset-top) + 30px) 22px 74px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;
  background:radial-gradient(70% 55% at 82% 8%,rgba(0,210,154,.2),transparent 65%);pointer-events:none}
.hero-brand{font-size:0.6563rem;font-weight:800;letter-spacing:.16em;color:var(--ac2);text-transform:uppercase;margin-bottom:14px}
.hero-name{font-size:1.6875rem;font-weight:900;letter-spacing:-.03em;line-height:1.25}
.hero-name small{font-size:1rem;font-weight:700;color:rgba(255,255,255,.72)}
.hero-meta{font-size:0.7813rem;color:rgba(255,255,255,.55);margin-top:7px}
.hero-goal{display:inline-block;margin-top:12px;font-size:0.75rem;font-weight:700;color:#ffd9a0;
  background:rgba(240,161,58,.14);border:1px solid rgba(240,161,58,.3);border-radius:999px;padding:5px 13px}
/* ── KPI 카드 (히어로에 겹침) ── */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:-44px 16px 18px;position:relative;z-index:2}
.kpi{background:var(--card);border-radius:15px;box-shadow:var(--shadow);padding:14px 6px;text-align:center}
.kpi-v{font-size:1.375rem;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi-v small{font-size:0.6875rem;font-weight:700;color:var(--tx3);margin-left:1px}
.kpi-v.green{color:var(--ac)}
.kpi-v.blue{color:var(--pro)}
.kpi-l{font-size:0.6875rem;color:var(--tx3);font-weight:700;margin-top:3px}
/* ── 공통 섹션 카드 ── */
.sec{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:0 16px 16px;padding:20px 18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.sec-t{font-size:1rem;font-weight:800;letter-spacing:-.02em}
.sec-t i{font-style:normal;margin-right:6px}
.sec-x{font-size:0.6875rem;color:var(--tx3);font-weight:600}
/* ── 드롭다운(아코디언) — 비포·애프터 날짜별 ── */
.acc{border:1px solid var(--brd);border-radius:14px;margin-bottom:10px;overflow:hidden;background:var(--card)}
.acc:last-child{margin-bottom:0}
.acc-h{display:flex;align-items:center;gap:8px;padding:13px 14px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.acc-d{font-weight:800;font-size:0.875rem;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.acc-sub{font-size:0.6875rem;color:var(--tx3);font-weight:700}
.acc-arw{margin-left:auto;color:var(--tx3);font-size:0.75rem;transition:transform .25s}
.acc.open{border-color:rgba(0,184,132,.35)}
.acc.open .acc-d{color:var(--ac)}
.acc.open .acc-arw{transform:rotate(180deg)}
.acc .acc-b{display:none;padding:2px 12px 14px}
.acc.open .acc-b{display:block}
/* ── 비포·애프터 ── */
.ba-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ba-col{position:relative;border-radius:13px;overflow:hidden;background:#000}
.ba-col video{display:block;width:100%;aspect-ratio:9/14;object-fit:cover;background:#000}
.ba-tag{position:absolute;top:8px;left:8px;z-index:2;font-size:0.5938rem;font-weight:800;letter-spacing:.08em;padding:3px 10px;border-radius:999px;color:#fff}
.ba-tag.b{background:var(--amber)}
.ba-tag.a{background:var(--ac)}
.ba-cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.72));
  color:#fff;font-size:0.6563rem;font-weight:700;padding:16px 9px 7px;text-align:center}
.ba-ctrl{display:flex;gap:7px;align-items:center;justify-content:center;margin-top:12px;flex-wrap:wrap}
.ba-btn{padding:10px 18px;border-radius:999px;border:none;background:var(--tx);color:#fff;font-weight:800;font-size:0.7813rem;cursor:pointer;font-family:inherit}
.ba-btn.play{background:var(--ac)}
.ba-sp{padding:7px 12px;border-radius:999px;border:1px solid var(--brd);background:var(--bg);color:var(--tx2);font-weight:800;font-size:0.7188rem;cursor:pointer;font-family:inherit}
.ba-sp.on{background:var(--ac);border-color:transparent;color:#fff}
.ba-delta{margin-top:12px;text-align:center;font-size:0.8125rem;font-weight:700;color:var(--tx2)}
.ba-delta b{color:var(--ac);font-size:0.9375rem}
.ba-delta small{color:var(--tx3);font-weight:600}
.ba-seekrow{display:flex;align-items:center;gap:9px;margin-top:12px;padding:0 2px}
.ba-time{font-size:0.6563rem;color:var(--tx3);font-weight:700;font-variant-numeric:tabular-nums;min-width:32px;text-align:center}
.ba-seek{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:999px;background:rgba(13,20,28,.14);outline:none}
.ba-seek::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--ac);border:2.5px solid #fff;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.ba-seek::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--ac);border:2.5px solid #fff;cursor:pointer}
/* 한쪽만 있는 날 — 단일 영상 */
.ba-one .ba-tag{position:static;display:inline-block;margin-bottom:8px}
.ba-onev{border-radius:13px;overflow:hidden;background:#000}
.ba-onev video{display:block;width:100%;max-height:420px;object-fit:contain;background:#000}
.ba-onec{margin-top:8px;font-size:0.75rem;color:var(--tx2);font-weight:700;text-align:center}
/* ── 추이 차트 ── */
.chart svg{width:100%;height:auto;display:block}
/* ── 클럽별 평균 (카드 행) ── */
.club-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--brd)}
.club-row:last-child{border-bottom:none}
.club-ic{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#e9f8f2,#d7f1e6);color:var(--ac);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:0.75rem;flex-shrink:0}
.club-nm{font-size:0.875rem;font-weight:800}
.club-sub{font-size:0.6875rem;color:var(--tx3);font-weight:600}
.club-val{margin-left:auto;text-align:right}
.club-carry{font-size:1.1875rem;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.club-carry small{font-size:0.6875rem;color:var(--tx3);font-weight:700}
/* ── 스윙 영상 가로 스크롤 ── */
.vids{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;-webkit-overflow-scrolling:touch}
.vids::-webkit-scrollbar{display:none}
.vid-card{flex:0 0 62%;scroll-snap-align:start;border-radius:13px;overflow:hidden;background:#000;position:relative}
.vid-card video{display:block;width:100%;aspect-ratio:9/14;object-fit:cover;background:#000}
.vid-meta{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));
  color:#fff;padding:18px 10px 8px;font-size:0.6875rem;font-weight:700}
.vid-meta small{display:block;font-weight:600;color:rgba(255,255,255,.72);font-size:0.625rem}
.vid-badge{position:absolute;top:8px;left:8px;font-size:0.5625rem;font-weight:800;letter-spacing:.07em;padding:3px 9px;border-radius:999px;color:#fff}
.vid-badge.b{background:var(--amber)}
.vid-badge.a{background:var(--ac)}
/* ── 레슨 일지 타임라인 (드롭다운) ── */
.tl{position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--brd);border-radius:2px}
.tl-item{position:relative;padding:0 0 16px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-18px;top:5px;width:12px;height:12px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--brd)}
.tl-dot.pro{background:var(--pro)}
.tl-dot.pt{background:var(--ac)}
.tl-head{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.tl-role{font-size:0.5625rem;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:6px}
.tl-role.pro{background:rgba(63,123,255,.1);color:var(--pro)}
.tl-role.pt{background:rgba(0,184,132,.1);color:var(--ac)}
.tl-author{font-size:0.7813rem;font-weight:700}
.tl-date{font-size:0.6875rem;color:var(--tx3);margin-left:auto;font-variant-numeric:tabular-nums}
.tl-arw{color:var(--tx3);font-size:0.6875rem;transition:transform .25s}
.tl-item.open .tl-arw{transform:rotate(180deg)}
.tl-prev{font-size:0.75rem;color:var(--tx3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:var(--bg);border-radius:10px;padding:8px 12px}
.tl-item.open .tl-prev{display:none}
.tl-fold{display:none}
.tl-item.open .tl-fold{display:block}
.tl-body{font-size:0.8438rem;color:var(--tx2);line-height:1.75;white-space:pre-line;word-break:keep-all;
  background:var(--bg);border-radius:12px;padding:12px 14px}
.tl-video{margin-top:8px;border-radius:12px;overflow:hidden;background:#000}
.tl-video video{display:block;width:100%;max-height:340px;object-fit:contain}
/* ── 푸터 ── */
.foot{text-align:center;padding:26px 20px 10px;color:var(--tx3);font-size:0.6875rem;line-height:1.8}
.foot b{color:var(--tx2)}
/* ── 돋보기 (글씨 확대) — 버튼 자체는 px 고정이라 배율과 무관하게 같은 크기 ── */
.rp-zoom{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);width:58px;height:58px;
  border-radius:50%;border:none;background:#0d1114;color:#fff;font-size:19px;cursor:pointer;z-index:50;
  box-shadow:0 4px 16px rgba(0,0,0,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:inherit}
.rp-zoom small{font-size:10px;font-weight:800;color:#00d29a;line-height:1.2}
/* ── 영상 다운로드 버튼 ── */
.dl-btn{padding:9px 14px;border-radius:999px;border:1px solid var(--brd);background:var(--bg);color:var(--tx2);
  font-weight:800;font-size:0.75rem;cursor:pointer;font-family:inherit}
.dl-btn:disabled{opacity:.6}
.ba-dlrow{display:flex;gap:8px;margin-top:10px}
.ba-dlrow .dl-btn{flex:1}
.dl-btn.one{display:block;width:100%;margin-top:10px}
.vid-dl{position:absolute;top:8px;right:8px;z-index:2;width:34px;height:34px;border-radius:50%;border:none;
  background:rgba(0,0,0,.55);color:#fff;font-size:15px;cursor:pointer;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.tl-dlrow{margin-top:6px}
.tl-dlrow .dl-btn{width:100%}
.loading{text-align:center;padding:90px 20px;color:var(--tx3)}
.spinner{width:32px;height:32px;border:3px solid var(--brd);border-top-color:var(--ac);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.error{text-align:center;padding:90px 20px;color:#c0392b;font-weight:600}
</style>
</head>
<body>
<div class="report" id="report">
  <div class="loading" id="loading"><div class="spinner"></div><div>리포트를 불러오는 중...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
// ===== 렌더 (데이터 → 화면). 테스트를 위해 전역 함수로 분리 =====
function renderReport(c, meta){
  var cfg=window.APP_CONFIG||{};
  // 자체 주소(워커)에서 열린 경우: 데이터가 서버에서 주입되고(window.__REPORT__),
  // 영상은 같은 주소에서 바로 스트리밍 → 페이지에 키·설정이 하나도 필요 없다.
  // 예전 방식(report.html?id=)으로 열린 경우: config 의 워커 주소를 사용(하위 호환).
  var boot=!!window.__REPORT__;
  var r2base=boot ? '' : (cfg.R2_WORKER_URL||null);
  var canVid=(r2base!==null);
  window.__R2BASE=r2base;   // 다운로드 버튼(rptDownload)이 영상 주소를 만들 때 사용
  var BR=Object.assign({name:'GOLF STUDIO', nameKo:'골프 스튜디오', measuredBy:'TRACKMAN'}, cfg.BRAND||{}, (c&&c.brand)||{});
  var storeKo=BR.store||BR.nameKo, storeEn=BR.storeEn||BR.name;
  function esc(x){ return String(x==null?'':x).replace(/[<>&"]/g,function(ch){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[ch];}); }
  function vurl(k){ return (r2base||'')+'/'+encodeURIComponent(k); }
  function distM(v,metric){ if(v==null||isNaN(v)) return null; return metric?+v:+v*0.9144; }
  function fmt(v,dec){ if(v==null||isNaN(v)) return '—'; return Number(v).toFixed(dec!=null?dec:0); }
  function fmtDay(day){ try{ var d=new Date(String(day)+'T00:00:00'); var w=['일','월','화','수','목','금','토'][d.getDay()];
    return String(day).replace(/-/g,'.')+(w?' ('+w+')':''); }catch(e){ return String(day); } }
  function miniLine(vals,labels){
    var W=520,H=150,pad={t:14,r:12,b:24,l:34},n=vals.length;
    if(n<2) return '';
    var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
    if(min===max){min-=1;max+=1;}
    var iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
    var X=function(i){return pad.l+iw*i/(n-1);},Y=function(v){return pad.t+ih*(1-(v-min)/(max-min));};
    var pts=vals.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1);}).join(' ');
    var area='M '+pts.split(' ').join(' L ')+' L '+X(n-1).toFixed(1)+','+(pad.t+ih)+' L '+X(0).toFixed(1)+','+(pad.t+ih)+' Z';
    var dots=vals.map(function(v,i){var last=i===n-1;return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+(last?4.4:2.6)+'" fill="'+(last?'#00b884':'#fff')+'" stroke="#00b884" stroke-width="'+(last?0:1.8)+'"/>';}).join('');
    var idxs=n<=5?labels.map(function(_,i){return i;}):[0,Math.floor((n-1)/2),n-1];
    var xl=idxs.map(function(i){var anc=i===0?'start':(i===n-1?'end':'middle');return '<text x="'+X(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+anc+'" font-size="9.5" fill="#8b93a0">'+esc(labels[i])+'</text>';}).join('');
    return '<svg viewBox="0 0 '+W+' '+H+'">'
      +'<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(0,184,132,.18)"/><stop offset="100%" stop-color="rgba(0,184,132,0)"/></linearGradient></defs>'
      +'<path d="'+area+'" fill="url(#ga)"/>'
      +'<polyline fill="none" stroke="#00b884" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" points="'+pts+'"/>'
      +dots+xl+'</svg>';
  }

  var m=c.member||{}, t=c.trackman;
  var bestCarry=t&&t.best?fmt(distM(t.best.carry,t.best.metric)):null;
  // 평균 캐리 — 클럽별 평균의 샷수 가중 평균 (GDR 연습장 모드처럼 데이터 중심 KPI)
  var avgCarry=null;
  if(t&&t.clubs&&t.clubs.length){
    var wsum=0,wn=0;
    t.clubs.forEach(function(a){ var cm=distM(a.carry,a.metric); if(cm!=null&&a.n){ wsum+=cm*a.n; wn+=a.n; } });
    if(wn>0) avgCarry=fmt(wsum/wn);
  }

  // ── 비포·애프터 패널 (날짜별 아코디언·구버전 단일 공용) ──
  var baCap=function(x){ return esc((x.club||'샷'))+(x.carry!=null?' · '+fmt(distM(x.carry,x.metric))+'m':''); };
  // open=false 인 패널의 영상은 data-src 로 두고, 펼칠 때 src 를 넣는다(트래픽 절약).
  function baInner(p, open){
    var vAttr=function(key){ var u=vurl(key); return open?('src="'+u+'"'):('data-src="'+u+'"'); };
    var inner='';
    if(p.b&&p.a){
      inner+='<div class="ba-grid">'
        +'<div class="ba-col"><span class="ba-tag b">BEFORE</span><video '+vAttr(p.b.key)+' playsinline muted loop preload="metadata"></video><div class="ba-cap">'+baCap(p.b)+'</div></div>'
        +'<div class="ba-col"><span class="ba-tag a">AFTER</span><video '+vAttr(p.a.key)+' playsinline muted loop preload="metadata"></video><div class="ba-cap">'+baCap(p.a)+'</div></div>'
        +'</div>'
        +'<div class="ba-seekrow"><span class="ba-time" data-role="cur">0.0s</span>'
        +'<input type="range" class="ba-seek" min="0" max="1000" value="0" step="1">'
        +'<span class="ba-time" data-role="dur">—</span></div>'
        +'<div class="ba-ctrl">'
        +'<button class="ba-btn play ba-play">▶ 동시 재생</button>'
        +'<button class="ba-btn ba-restart">⏮ 처음부터</button>'
        +[0.25,0.5,1].map(function(sp){return '<button class="ba-sp'+(sp===0.5?' on':'')+'" data-sp="'+sp+'">'+(sp===1?'1×':String(sp).replace('0.','.')+'×')+'</button>';}).join('')
        +'</div>';
      var bC=distM(p.b.carry,p.b.metric), aC=distM(p.a.carry,p.a.metric);
      if(bC!=null&&aC!=null&&aC>bC) inner+='<div class="ba-delta">비거리가 <b>'+fmt(aC-bC)+'m 증가했어요!</b> <small>(캐리 기준)</small></div>';
      inner+='<div class="ba-dlrow">'
        +'<button class="dl-btn" data-k="'+esc(p.b.key)+'" data-n="비포_'+esc(p.date||String(p.b.ts||'').slice(0,10))+'" onclick="rptDownload(this)">⬇ 비포 저장</button>'
        +'<button class="dl-btn" data-k="'+esc(p.a.key)+'" data-n="애프터_'+esc(p.date||String(p.a.ts||'').slice(0,10))+'" onclick="rptDownload(this)">⬇ 애프터 저장</button>'
        +'</div>';
    } else {
      var one=p.b||p.a, isB=!!p.b;
      if(one) inner+='<div class="ba-one"><span class="ba-tag '+(isB?'b':'a')+'">'+(isB?'BEFORE':'AFTER')+'</span>'
        +'<div class="ba-onev"><video '+vAttr(one.key)+' controls playsinline preload="'+(open?'metadata':'none')+'"></video></div>'
        +'<div class="ba-onec">'+baCap(one)+'</div>'
        +'<button class="dl-btn one" data-k="'+esc(one.key)+'" data-n="스윙_'+esc(p.date||String(one.ts||'').slice(0,10))+'" onclick="rptDownload(this)">⬇ 영상 저장</button></div>';
    }
    return inner;
  }

  var html='';

  // 히어로 — 정식 상호로 표기
  html+='<div class="hero"><div class="hero-brand">'+esc(storeEn)+'</div>'
    +'<div class="hero-name">'+esc(meta.memberName)+' <small>회원님 성과 리포트</small></div>'
    +'<div class="hero-meta">'+esc(storeKo)+' · '+esc((meta.createdAt||'').slice(0,10))+(m.handicap?' · 핸디캡 '+esc(m.handicap):'')+'</div>'
    +(m.goal?'<div class="hero-goal">🎯 목표 · '+esc(m.goal)+'</div>':'')
    +'</div>';

  // KPI — 연습장 모드처럼 측정 데이터 중심 (베스트 캐리 · 평균 캐리 · 측정 샷)
  html+='<div class="kpis">'
    +'<div class="kpi"><div class="kpi-v green">'+(bestCarry!=null?bestCarry:'—')+'<small>m</small></div><div class="kpi-l">베스트 캐리</div></div>'
    +'<div class="kpi"><div class="kpi-v">'+(avgCarry!=null?avgCarry:'—')+'<small>m</small></div><div class="kpi-l">평균 캐리</div></div>'
    +'<div class="kpi"><div class="kpi-v blue">'+(t?t.shotCount:0)+'<small>구</small></div><div class="kpi-l">측정 샷</div></div>'
    +'</div>';

  // 비포 · 애프터 — 레슨 날짜별 드롭다운 (최신 날짜만 펼침)
  var baList=(t&&t.baDates&&t.baDates.length)?t.baDates:null;
  if(baList && canVid){
    html+='<div class="sec"><div class="sec-h"><div class="sec-t"><i>🎬</i>비포 · 애프터</div><div class="sec-x">레슨 날짜별 · 눌러서 펼치기</div></div>'
      +baList.map(function(p,i){
        var open=i===0;
        return '<div class="acc ba-wrap'+(open?' open':'')+'">'
          +'<div class="acc-h" onclick="__acc(this)"><span class="acc-d">'+esc(fmtDay(p.date))+'</span>'
          +'<span class="acc-sub">'+(p.tagged?'프로 지정 비포·애프터':(p.b&&p.a?'레슨 시작 vs 마무리':'레슨 영상'))+'</span>'
          +'<span class="acc-arw">▾</span></div>'
          +'<div class="acc-b">'+baInner(p,open)+'</div></div>';
      }).join('')
      +'</div>';
  } else if(t && t.beforeAfter && canVid){
    // 구버전 리포트(날짜별 데이터 없음) — 단일 비포·애프터
    var ba=t.beforeAfter;
    html+='<div class="sec"><div class="sec-h"><div class="sec-t"><i>🎬</i>비포 · 애프터</div><div class="sec-x">'+(ba.tagged?'프로 지정 비교':'처음 vs 현재')+'</div></div>'
      +'<div class="ba-wrap">'+baInner({b:ba.b,a:ba.a,tagged:ba.tagged},true)+'</div>'
      +'</div>';
  }

  // 캐리 추이
  if(t && t.trend && t.trend.length>=2){
    html+='<div class="sec"><div class="sec-h"><div class="sec-t"><i>📈</i>캐리 성장 추이</div><div class="sec-x">'+esc(t.trendClub||'')+' · m</div></div>'
      +'<div class="chart">'+miniLine(t.trend.map(function(x){return x.carryM;}), t.trend.map(function(x){return String(x.date||'').slice(5);}))+'</div></div>';
  }

  // 클럽별 평균
  if(t && t.clubs && t.clubs.length){
    html+='<div class="sec"><div class="sec-h"><div class="sec-t"><i>🏌️</i>클럽별 평균</div><div class="sec-x">'+esc(t.measuredBy||BR.measuredBy)+' 실측</div></div>';
    t.clubs.forEach(function(a){
      var sp=a.ballSpeed==null?null:(a.metric?a.ballSpeed:a.ballSpeed*0.44704);
      html+='<div class="club-row"><div class="club-ic">'+esc(String(a.name||'').slice(0,3))+'</div>'
        +'<div><div class="club-nm">'+esc(a.name)+'</div><div class="club-sub">'+a.n+'구 · 볼 '+fmt(sp,1)+'㎧ · 스매시 '+(a.smash!=null?Number(a.smash).toFixed(2):'—')+'</div></div>'
        +'<div class="club-val"><div class="club-carry">'+fmt(distM(a.carry,a.metric))+'<small> m</small></div><div class="club-sub">토탈 '+fmt(distM(a.total,a.metric))+'m</div></div>'
      +'</div>';
    });
    html+='</div>';
  }

  // 스윙 영상
  if(t && t.videos && t.videos.length && canVid){
    html+='<div class="sec"><div class="sec-h"><div class="sec-t"><i>🎥</i>내 스윙 영상</div><div class="sec-x">옆으로 넘겨보세요</div></div><div class="vids">';
    t.videos.forEach(function(v){
      var badge=v.tag==='before'?'<span class="vid-badge b">BEFORE</span>':(v.tag==='after'?'<span class="vid-badge a">AFTER</span>':'');
      html+='<div class="vid-card">'+badge
        +'<button class="vid-dl" data-k="'+esc(v.key)+'" data-n="스윙_'+esc(String(v.ts||'').slice(0,10))+'" onclick="rptDownload(this)" title="영상 저장">⬇</button>'
        +'<video src="'+vurl(v.key)+'" controls playsinline preload="metadata"></video>'
        +'<div class="vid-meta">'+esc(v.club||'샷')+(v.carry!=null?' · '+fmt(distM(v.carry,v.metric))+'m':'')+'<small>'+esc(String(v.ts||'').slice(0,10))+'</small></div>'
      +'</div>';
    });
    html+='</div></div>';
  }

  // 레슨 일지 타임라인 — 드롭다운 (최근 1건만 펼침, 나머지는 한 줄 미리보기)
  if(c.sessions && c.sessions.length){
    html+='<div class="sec"><div class="sec-h"><div class="sec-t"><i>📝</i>레슨 일지</div><div class="sec-x">최근 '+c.sessions.length+'회 · 눌러서 펼치기</div></div><div class="tl">';
    c.sessions.forEach(function(s,i){
      var isPro=(s.role||'').indexOf('pro')!==-1;
      var open=i===0;
      var prevTxt=String(s.content||'').replace(/\s+/g,' ').trim();
      var prev=prevTxt.slice(0,46)+(prevTxt.length>46?'…':'');
      html+='<div class="tl-item'+(open?' open':'')+'"><span class="tl-dot '+(isPro?'pro':'pt')+'"></span>'
        +'<div class="tl-head" onclick="__acc(this)"><span class="tl-role '+(isPro?'pro':'pt')+'">'+(isPro?'골프 레슨':'골프 PT')+'</span>'
        +'<span class="tl-author">'+esc(s.author||'')+'</span><span class="tl-date">'+esc(s.date||'')+(s.time?' '+esc(s.time):'')+'</span><span class="tl-arw">▾</span></div>'
        +(prev?'<div class="tl-prev">'+esc(prev)+'</div>':'')
        +'<div class="tl-fold"><div class="tl-body">'+esc(s.content||'')+'</div>';
      (s.videos||[]).forEach(function(v){
        if(v.key && canVid){
          var u=vurl(v.key);
          html+='<div class="tl-video"><video '+(open?('src="'+u+'"'):('data-src="'+u+'"'))+' controls playsinline preload="'+(open?'metadata':'none')+'"></video></div>'
            +'<div class="tl-dlrow"><button class="dl-btn" data-k="'+esc(v.key)+'" data-n="레슨영상_'+esc(s.date||'')+'" onclick="rptDownload(this)">⬇ 영상 저장</button></div>';
        }
      });
      html+='</div></div>';
    });
    html+='</div></div>';
  }

  html+='<div class="foot"><b>'+esc(storeKo)+'</b> · 데이터로 증명하는 코칭<br>본 리포트의 탄도 데이터는 '+esc(t&&t.measuredBy||BR.measuredBy)+' 로 측정되었습니다</div>';
  html+='<button class="rp-zoom" onclick="rptZoom()" title="글씨 크기 확대">🔍<small>가</small></button>';
  document.getElementById('report').innerHTML=html;

  // 초기 펼침 상태 패널 배선 (아코디언 최신 날짜 · 구버전 단일 패널)
  [].slice.call(document.querySelectorAll('.ba-wrap.open, .ba-wrap:not(.acc)')).forEach(wireBA);
  _rptApplyZoom();   // 저장해둔 글씨 배율 복원
}

// ── 돋보기 — 누를 때마다 가 → 가+ → 가++ → 가+++ → 가 순환. 선택은 기기에 기억 ──
var _RPT_SCALES=[1,1.18,1.4,1.65];
function _rptZoomIdx(){ var i=0; try{ i=parseInt(localStorage.getItem('rpt_ts')||'0',10)||0; }catch(e){} return ((i%_RPT_SCALES.length)+_RPT_SCALES.length)%_RPT_SCALES.length; }
function _rptApplyZoom(){
  var i=_rptZoomIdx();
  document.documentElement.style.fontSize=(16*_RPT_SCALES[i])+'px';
  var b=document.querySelector('.rp-zoom small');
  if(b) b.textContent=['가','가+','가++','가+++'][i];
}
function rptZoom(){
  var i=(_rptZoomIdx()+1)%_RPT_SCALES.length;
  try{ localStorage.setItem('rpt_ts',String(i)); }catch(e){}
  _rptApplyZoom();
}

// ── 영상 다운로드 — 아이폰: 공유시트(사진 앱에 저장) · 갤럭시/PC: 파일 다운로드 ──
async function rptDownload(btn){
  var key=btn.getAttribute('data-k'), name=btn.getAttribute('data-n')||'video';
  if(!key||btn._busy) return;
  var base=window.__R2BASE;
  if(base==null){ alert('영상 다운로드를 사용할 수 없습니다.'); return; }
  var url=(base||'')+'/'+encodeURIComponent(key);
  var extM=String(key).match(/\.(mp4|mov|webm|m4v)$/i);
  var fname=(name.replace(/[\\/:*?"<>|]/g,'_'))+'.'+(extM?extM[1].toLowerCase():'mp4');
  var orig=btn.innerHTML; btn._busy=1; btn.disabled=true;
  function restore(txt){ btn.innerHTML=txt||orig; btn._busy=0; btn.disabled=false;
    if(txt) setTimeout(function(){ btn.innerHTML=orig; },1800); }
  try{
    btn.innerHTML='0%';
    var res=await fetch(url);
    if(!res.ok) throw new Error('다운로드 실패 ('+res.status+')');
    var total=parseInt(res.headers.get('content-length')||'0',10), got=0, chunks=[], blob;
    var reader=(res.body&&res.body.getReader)?res.body.getReader():null;
    if(reader){
      while(true){ var c=await reader.read(); if(c.done) break;
        chunks.push(c.value); got+=c.value.length;
        if(total) btn.innerHTML=Math.min(99,Math.round(got/total*100))+'%'; }
      blob=new Blob(chunks,{type:'video/mp4'});
    } else blob=await res.blob();
    // 아이폰 — 공유시트를 띄워 "비디오 저장"으로 사진 앱에 저장
    var isIOS=/iP(hone|ad|od)/.test(navigator.userAgent||'');
    if(isIOS && navigator.canShare && typeof File!=='undefined'){
      try{
        var f=new File([blob],fname,{type:'video/mp4'});
        if(navigator.canShare({files:[f]})){ await navigator.share({files:[f]}); restore('✅ 완료'); return; }
      }catch(e){ if(e&&e.name==='AbortError'){ restore(); return; } }
    }
    // 갤럭시/PC — 다운로드 폴더로 저장
    var bu=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=bu; a.download=fname;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{URL.revokeObjectURL(bu); a.remove();}catch(e){} },1500);
    restore('✅ 완료');
  }catch(e){
    alert('영상 다운로드에 실패했습니다 — '+(e&&e.message||e));
    restore();
  }
}

// ── 드롭다운 토글 (비포·애프터 날짜 / 레슨 일지 공용) ──
// 펼칠 때: 미뤄둔 영상(data-src) 로드 + 비포·애프터 컨트롤 배선. 접을 때: 재생 정지.
function __acc(h){
  var box=h.parentNode;
  var open=box.classList.toggle('open');
  if(open){
    [].slice.call(box.querySelectorAll('video[data-src]')).forEach(function(v){
      v.src=v.getAttribute('data-src'); v.removeAttribute('data-src');
      try{ v.preload='metadata'; }catch(e){}
    });
    wireBA(box);
  }else{
    [].slice.call(box.querySelectorAll('video')).forEach(function(v){ try{v.pause();}catch(e){} });
  }
}

// ── 비포·애프터 컨트롤 배선 (패널 단위) — 동시 재생 · 공용 시크바 · 배속 ──
function wireBA(root){
  if(!root || root.getAttribute('data-ba-wired')) return;
  root.setAttribute('data-ba-wired','1');
  var baVids=[].slice.call(root.querySelectorAll('.ba-grid video'));
  if(baVids.length!==2) return;
  var rate=0.5, master=baVids[0], dragging=false;
  var seek=root.querySelector('.ba-seek');
  var curEl=root.querySelector('.ba-time[data-role="cur"]'), durEl=root.querySelector('.ba-time[data-role="dur"]');
  var play=root.querySelector('.ba-play'), restart=root.querySelector('.ba-restart');
  if(!seek||!curEl||!durEl||!play||!restart) return;
  function ft(x){ return (Math.round(x*10)/10).toFixed(1)+'s'; }
  baVids.forEach(function(v){ try{v.playbackRate=rate;}catch(e){} v.addEventListener('loadedmetadata',function(){try{v.playbackRate=rate;}catch(e){}}); });
  master.addEventListener('loadedmetadata', function(){ if(isFinite(master.duration)) durEl.textContent=ft(master.duration); });
  master.addEventListener('timeupdate', function(){
    if(dragging||!isFinite(master.duration)||!master.duration) return;
    seek.value=Math.round(master.currentTime/master.duration*1000);
    curEl.textContent=ft(master.currentTime);
  });
  function seekBoth(){
    var pct=(parseInt(seek.value,10)||0)/1000;
    baVids.forEach(function(v){ if(isFinite(v.duration)&&v.duration){ try{v.currentTime=v.duration*pct;}catch(e){} } });
    if(isFinite(master.duration)&&master.duration) curEl.textContent=ft(master.duration*pct);
  }
  var wasPlaying=false;
  seek.addEventListener('input', function(){
    if(!dragging){ dragging=true; wasPlaying=baVids.some(function(v){return !v.paused;}); baVids.forEach(function(v){v.pause();}); }
    seekBoth();
  });
  seek.addEventListener('change', function(){
    seekBoth(); dragging=false;
    if(wasPlaying){ baVids.forEach(function(v){v.play().catch(function(){});}); play.textContent='⏸ 일시정지'; }
    wasPlaying=false;
  });
  play.onclick=function(){
    var on=baVids.some(function(v){return !v.paused;});
    if(on){ baVids.forEach(function(v){v.pause();}); play.textContent='▶ 동시 재생'; }
    else{ baVids.forEach(function(v){v.play().catch(function(){});}); play.textContent='⏸ 일시정지'; }
  };
  restart.onclick=function(){
    baVids.forEach(function(v){ try{v.currentTime=0;}catch(e){} v.play().catch(function(){}); });
    seek.value=0; play.textContent='⏸ 일시정지';
  };
  [].slice.call(root.querySelectorAll('.ba-sp')).forEach(function(b){
    b.onclick=function(){ rate=parseFloat(b.getAttribute('data-sp'))||1;
      baVids.forEach(function(v){try{v.playbackRate=rate;}catch(e){}});
      [].slice.call(root.querySelectorAll('.ba-sp')).forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); };
  });
}

// ===== 데이터 로드 =====
(async function(){
  // ① 자체 주소(워커)에서 열린 경우 — 데이터가 서버에서 주입됨. 키·외부요청 0.
  var boot=window.__REPORT__;
  if(boot && boot.content){
    try{ document.title=(boot.member_name||'')+' 성과 리포트'; }catch(e){}
    renderReport(boot.content||{}, {memberName:boot.member_name||'', createdBy:boot.created_by||'', createdAt:boot.created_at||''});
    return;
  }
  // ② (하위 호환) report.html?id= 로 열린 예전 링크 — 기존 조회 방식
  var cfg=window.APP_CONFIG||{};
  var id=new URLSearchParams(location.search).get('id');
  if(!id){ document.getElementById('loading').innerHTML='<div class="error">리포트 주소가 올바르지 않습니다.</div>'; return; }
  if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY){ document.getElementById('loading').innerHTML='<div class="error">설정 오류</div>'; return; }
  try{
    var client=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
    var r=await client.from('reports').select('*').eq('id',id).single();
    if(r.error||!r.data) throw new Error('리포트를 찾을 수 없습니다. 담당 지도자에게 새 링크를 요청해주세요.');
    try{ document.title=r.data.member_name+' 성과 리포트'; }catch(e){}
    renderReport(r.data.content||{}, {memberName:r.data.member_name, createdBy:r.data.created_by, createdAt:r.data.created_at||''});
  }catch(e){
    document.getElementById('loading').innerHTML='<div class="error">'+String(e&&e.message||e)+'</div>';
  }
})();
</script>
