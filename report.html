<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1f17">
<title>성과 리포트</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ac:#00b884;--ac2:#00d29a;--pro:#3f7bff;--amber:#f0a13a;
  --tx:#0d1114;--tx2:#454c55;--tx3:#8b93a0;--bg:#f2f4f6;--card:#fff;--brd:rgba(13,20,28,.07);
  --r:18px;--shadow:0 2px 14px rgba(10,20,30,.06)}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Pretendard','Noto Sans KR',sans-serif;
  background:var(--bg);color:var(--tx);line-height:1.65;-webkit-font-smoothing:antialiased}
.report{max-width:560px;margin:0 auto;padding-bottom:70px}
/* ── 히어로 헤더 (GDR 앱 스타일 다크 그린) ── */
.hero{background:linear-gradient(158deg,#0b241a 0%,#0b1f17 46%,#081410 100%);color:#fff;
  padding:calc(env(safe-area-inset-top) + 30px) 22px 74px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;
  background:radial-gradient(70% 55% at 82% 8%,rgba(0,210,154,.2),transparent 65%);pointer-events:none}
.hero-brand{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--ac2);text-transform:uppercase;margin-bottom:14px}
.hero-name{font-size:27px;font-weight:900;letter-spacing:-.03em;line-height:1.25}
.hero-name small{font-size:16px;font-weight:700;color:rgba(255,255,255,.72)}
.hero-meta{font-size:12.5px;color:rgba(255,255,255,.55);margin-top:7px}
.hero-goal{display:inline-block;margin-top:12px;font-size:12px;font-weight:700;color:#ffd9a0;
  background:rgba(240,161,58,.14);border:1px solid rgba(240,161,58,.3);border-radius:999px;padding:5px 13px}
/* ── KPI 카드 (히어로에 겹침) ── */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:-44px 16px 18px;position:relative;z-index:2}
.kpi{background:var(--card);border-radius:15px;box-shadow:var(--shadow);padding:14px 6px;text-align:center}
.kpi-v{font-size:22px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi-v small{font-size:11px;font-weight:700;color:var(--tx3);margin-left:1px}
.kpi-v.green{color:var(--ac)}
.kpi-v.blue{color:var(--pro)}
.kpi-l{font-size:11px;color:var(--tx3);font-weight:700;margin-top:3px}
/* ── 공통 섹션 카드 ── */
.sec{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:0 16px 16px;padding:20px 18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.sec-t{font-size:16px;font-weight:800;letter-spacing:-.02em}
.sec-t i{font-style:normal;margin-right:6px}
.sec-x{font-size:11px;color:var(--tx3);font-weight:600}
/* ── 비포·애프터 ── */
.ba-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ba-col{position:relative;border-radius:13px;overflow:hidden;background:#000}
.ba-col video{display:block;width:100%;aspect-ratio:9/14;object-fit:cover;background:#000}
.ba-tag{position:absolute;top:8px;left:8px;z-index:2;font-size:9.5px;font-weight:800;letter-spacing:.08em;padding:3px 10px;border-radius:999px;color:#fff}
.ba-tag.b{background:var(--amber)}
.ba-tag.a{background:var(--ac)}
.ba-cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.72));
  color:#fff;font-size:10.5px;font-weight:700;padding:16px 9px 7px;text-align:center}
.ba-ctrl{display:flex;gap:7px;align-items:center;justify-content:center;margin-top:12px;flex-wrap:wrap}
.ba-btn{padding:10px 18px;border-radius:999px;border:none;background:var(--tx);color:#fff;font-weight:800;font-size:12.5px;cursor:pointer;font-family:inherit}
.ba-btn.play{background:var(--ac)}
.ba-sp{padding:7px 12px;border-radius:999px;border:1px solid var(--brd);background:var(--bg);color:var(--tx2);font-weight:800;font-size:11.5px;cursor:pointer;font-family:inherit}
.ba-sp.on{background:var(--ac);border-color:transparent;color:#fff}
.ba-delta{margin-top:12px;text-align:center;font-size:13px;font-weight:700;color:var(--tx2)}
.ba-delta b{color:var(--ac);font-size:15px}
/* ── 추이 차트 ── */
.chart svg{width:100%;height:auto;display:block}
/* ── 클럽별 평균 (카드 행) ── */
.club-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--brd)}
.club-row:last-child{border-bottom:none}
.club-ic{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#e9f8f2,#d7f1e6);color:var(--ac);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;flex-shrink:0}
.club-nm{font-size:14px;font-weight:800}
.club-sub{font-size:11px;color:var(--tx3);font-weight:600}
.club-val{margin-left:auto;text-align:right}
.club-carry{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.club-carry small{font-size:11px;color:var(--tx3);font-weight:700}
/* ── 스윙 영상 가로 스크롤 ── */
.vids{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;-webkit-overflow-scrolling:touch}
.vids::-webkit-scrollbar{display:none}
.vid-card{flex:0 0 62%;scroll-snap-align:start;border-radius:13px;overflow:hidden;background:#000;position:relative}
.vid-card video{display:block;width:100%;aspect-ratio:9/14;object-fit:cover;background:#000}
.vid-meta{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));
  color:#fff;padding:18px 10px 8px;font-size:11px;font-weight:700}
.vid-meta small{display:block;font-weight:600;color:rgba(255,255,255,.72);font-size:10px}
.vid-badge{position:absolute;top:8px;left:8px;font-size:9px;font-weight:800;letter-spacing:.07em;padding:3px 9px;border-radius:999px;color:#fff}
.vid-badge.b{background:var(--amber)}
.vid-badge.a{background:var(--ac)}
/* ── 레슨 일지 타임라인 ── */
.tl{position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--brd);border-radius:2px}
.tl-item{position:relative;padding:0 0 18px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-18px;top:5px;width:12px;height:12px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--brd)}
.tl-dot.pro{background:var(--pro)}
.tl-dot.pt{background:var(--ac)}
.tl-head{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap}
.tl-role{font-size:9px;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:6px}
.tl-role.pro{background:rgba(63,123,255,.1);color:var(--pro)}
.tl-role.pt{background:rgba(0,184,132,.1);color:var(--ac)}
.tl-author{font-size:12.5px;font-weight:700}
.tl-date{font-size:11px;color:var(--tx3);margin-left:auto;font-variant-numeric:tabular-nums}
.tl-body{font-size:13.5px;color:var(--tx2);line-height:1.75;white-space:pre-line;word-break:keep-all;
  background:var(--bg);border-radius:12px;padding:12px 14px}
.tl-video{margin-top:8px;border-radius:12px;overflow:hidden;background:#000}
.tl-video video{display:block;width:100%;max-height:340px;object-fit:contain}
/* ── 푸터 ── */
.foot{text-align:center;padding:26px 20px 10px;color:var(--tx3);font-size:11px;line-height:1.8}
.foot b{color:var(--tx2)}
.loading{text-align:center;padding:90px 20px;color:var(--tx3)}
.spinner{width:32px;height:32px;border:3px solid var(--brd);border-top-color:var(--ac);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.error{text-align:center;padding:90px 20px;color:#c0392b;font-weight:600}
</style>
</head>
<body>
<div class="report" id="report">
  <div class="loading" id="loading"><div class="spinner"></div><div>리포트를 불러오는 중...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
// ===== 렌더 (데이터 → 화면). 테스트를 위해 전역 함수로 분리 =====
function renderReport(c, meta){
  var cfg=window.APP_CONFIG||{};
  var r2url=cfg.R2_WORKER_URL||'';
  var BR=Object.assign({name:'GOLF STUDIO', nameKo:'골프 스튜디오', measuredBy:'TRACKMAN'}, cfg.BRAND||{}, (c&&c.brand)||{});
  function esc(x){ return String(x==null?'':x).replace(/[<>&"]/g,function(ch){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[ch];}); }
  function vurl(k){ return r2url ? r2url+'/'+encodeURIComponent(k) : ''; }
  function distM(v,metric){ if(v==null||isNaN(v)) return null; return metric?+v:+v*0.9144; }
  function fmt(v,dec){ if(v==null||isNaN(v)) return '—'; return Number(v).toFixed(dec!=null?dec:0); }
  function miniLine(vals,labels){
    var W=520,H=150,pad={t:14,r:12,b:24,l:34},n=vals.length;
    if(n<2) return '';
    var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
    if(min===max){min-=1;max+=1;}
    var iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
    var X=function(i){return pad.l+iw*i/(n-1);},Y=function(v){return pad.t+ih*(1-(v-min)/(max-min));};
    var pts=vals.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1);}).join(' ');
    var area='M '+pts.split(' ').join(' L ')+' L '+X(n-1).toFixed(1)+','+(pad.t+ih)+' L '+X(0).toFixed(1)+','+(pad.t+ih)+' Z';
    var dots=vals.map(function(v,i){var last=i===n-1;return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+(last?4.4:2.6)+'" fill="'+(last?'#00b884':'#fff')+'" stroke="#00b884" stroke-width="'+(last?0:1.8)+'"/>';}).join('');
    var idxs=n<=5?labels.map(function(_,i){return i;}):[0,Math.floor((n-1)/2),n-1];
    var xl=idxs.map(function(i){var anc=i===0?'start':(i===n-1?'end':'middle');return '<text x="'+X(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+anc+'" font-size="9.5" fill="#8b93a0">'+esc(labels[i])+'</text>';}).join('');
    return '<svg viewBox="0 0 '+W+' '+H+'">'
      +'<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(0,184,132,.18)"/><stop offset="100%" stop-color="rgba(0,184,132,0)"/></linearGradient></defs>'
      +'<path d="'+area+'" fill="url(#ga)"/>'
      +'<polyline fill="none" stroke="#00b884" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" points="'+pts+'"/>'
      +dots+xl+'</svg>';
  }

  var m=c.member||{}, t=c.trackman;
  var bestCarry=t&&t.best?fmt(distM(t.best.carry,t.best.metric)):null;
  var html='';

  // 히어로
  html+='<div class="hero"><div class="hero-brand">'+esc(BR.name)+' · PERFORMANCE</div>'
    +'<div class="hero-name">'+esc(meta.memberName)+' <small>회원님 성과 리포트</small></div>'
    +'<div class="hero-meta">'+esc(BR.nameKo)+' · '+esc((meta.createdAt||'').slice(0,10))+(m.handicap?' · 핸디캡 '+esc(m.handicap):'')+'</div>'
    +(m.goal?'<div class="hero-goal">🎯 목표 · '+esc(m.goal)+'</div>':'')
    +'</div>';

  // KPI
  html+='<div class="kpis">'
    +'<div class="kpi"><div class="kpi-v">'+(c.totalSessions||0)+'<small>회</small></div><div class="kpi-l">총 레슨</div></div>'
    +'<div class="kpi"><div class="kpi-v green">'+(bestCarry!=null?bestCarry:'—')+'<small>m</small></div><div class="kpi-l">베스트 캐리</div></div>'
    +'<div class="kpi"><div class="kpi-v blue">'+(t?t.shotCount:0)+'<small>구</small></div><div class="kpi-l">측정 샷</div></div>'
    +'</div>';

  // 비포 · 애프터
  if(t && t.beforeAfter && r2url){
    var ba=t.beforeAfter;
    var cap=function(x){ return esc((x.club||'샷'))+' · '+esc(String(x.ts||'').slice(5,10))+(x.carry!=null?' · '+fmt(distM(x.carry,x.metric))+'m':''); };
    html+='<div class="sec"><div class="sec-h"><div class="sec-t"><i>🎬</i>비포 · 애프터</div><div class="sec-x">'+(ba.tagged?'프로 지정 비교':'처음 vs 현재')+'</div></div>'
      +'<div class="ba-grid">'
        +'<div class="ba-col"><span class="ba-tag b">BEFORE</span><video src="'+vurl(ba.b.key)+'" playsinline muted loop preload="metadata"></video><div class="ba-cap">'+cap(ba.b)+'</div></div>'
        +'<div class="ba-col"><span class="ba-tag a">AFTER</span><video src="'+vurl(ba.a.key)+'" playsinline muted loop preload="metadata"></video><div class="ba-cap">'+cap(ba.a)+'</div></div>'
      +'</div>'
      +'<div class="ba-ctrl">'
        +'<button class="ba-btn play" id="ba-play">▶ 동시 재생</button>'
        +'<button class="ba-btn" id="ba-restart">⏮ 처음부터</button>'
        +[0.25,0.5,1].map(function(sp){return '<button class="ba-sp'+(sp===0.5?' on':'')+'" data-sp="'+sp+'">'+(sp===1?'1×':String(sp).replace('0.','.')+'×')+'</button>';}).join('')
      +'</div>';
    var bC=distM(ba.b.carry,ba.b.metric), aC=distM(ba.a.carry,ba.a.metric);
    if(bC!=null&&aC!=null&&aC>bC) html+='<div class="ba-delta">캐리 <b>+'+fmt(aC-bC)+'m</b> 성장했어요</div>';
    html+='</div>';
  }

  // 캐리 추이
  if(t && t.trend && t.trend.length>=2){
    html+='<div class="sec"><div class="sec-h"><div class="sec-t"><i>📈</i>캐리 성장 추이</div><div class="sec-x">'+esc(t.trendClub||'')+' · m</div></div>'
      +'<div class="chart">'+miniLine(t.trend.map(function(x){return x.carryM;}), t.trend.map(function(x){return String(x.date||'').slice(5);}))+'</div></div>';
  }

  // 클럽별 평균
  if(t && t.clubs && t.clubs.length){
    html+='<div class="sec"><div class="sec-h"><div class="sec-t"><i>🏌️</i>클럽별 평균</div><div class="sec-x">'+esc(t.measuredBy||BR.measuredBy)+' 실측</div></div>';
    t.clubs.forEach(function(a){
      var sp=a.ballSpeed==null?null:(a.metric?a.ballSpeed:a.ballSpeed*0.44704);
      html+='<div class="club-row"><div class="club-ic">'+esc(String(a.name||'').slice(0,3))+'</div>'
        +'<div><div class="club-nm">'+esc(a.name)+'</div><div class="club-sub">'+a.n+'구 · 볼 '+fmt(sp,1)+'㎧ · 스매시 '+(a.smash!=null?Number(a.smash).toFixed(2):'—')+'</div></div>'
        +'<div class="club-val"><div class="club-carry">'+fmt(distM(a.carry,a.metric))+'<small> m</small></div><div class="club-sub">토탈 '+fmt(distM(a.total,a.metric))+'m</div></div>'
      +'</div>';
    });
    html+='</div>';
  }

  // 스윙 영상
  if(t && t.videos && t.videos.length && r2url){
    html+='<div class="sec"><div class="sec-h"><div class="sec-t"><i>🎥</i>내 스윙 영상</div><div class="sec-x">옆으로 넘겨보세요</div></div><div class="vids">';
    t.videos.forEach(function(v){
      var badge=v.tag==='before'?'<span class="vid-badge b">BEFORE</span>':(v.tag==='after'?'<span class="vid-badge a">AFTER</span>':'');
      html+='<div class="vid-card">'+badge
        +'<video src="'+vurl(v.key)+'" controls playsinline preload="metadata"></video>'
        +'<div class="vid-meta">'+esc(v.club||'샷')+(v.carry!=null?' · '+fmt(distM(v.carry,v.metric))+'m':'')+'<small>'+esc(String(v.ts||'').slice(0,10))+'</small></div>'
      +'</div>';
    });
    html+='</div></div>';
  }

  // 레슨 일지 타임라인
  if(c.sessions && c.sessions.length){
    html+='<div class="sec"><div class="sec-h"><div class="sec-t"><i>📝</i>레슨 일지</div><div class="sec-x">최근 '+c.sessions.length+'회</div></div><div class="tl">';
    c.sessions.forEach(function(s){
      var isPro=(s.role||'').indexOf('pro')!==-1;
      html+='<div class="tl-item"><span class="tl-dot '+(isPro?'pro':'pt')+'"></span>'
        +'<div class="tl-head"><span class="tl-role '+(isPro?'pro':'pt')+'">'+(isPro?'골프 레슨':'골프 PT')+'</span>'
        +'<span class="tl-author">'+esc(s.author||'')+'</span><span class="tl-date">'+esc(s.date||'')+(s.time?' '+esc(s.time):'')+'</span></div>'
        +'<div class="tl-body">'+esc(s.content||'')+'</div>';
      (s.videos||[]).forEach(function(v){
        if(v.key && r2url) html+='<div class="tl-video"><video src="'+vurl(v.key)+'" controls playsinline preload="metadata"></video></div>';
      });
      html+='</div>';
    });
    html+='</div></div>';
  }

  html+='<div class="foot"><b>'+esc(BR.nameKo)+'</b> · 데이터로 증명하는 코칭<br>본 리포트의 탄도 데이터는 '+esc(t&&t.measuredBy||BR.measuredBy)+' 로 측정되었습니다</div>';
  document.getElementById('report').innerHTML=html;

  // 비포·애프터 컨트롤 배선
  var baVids=[].slice.call(document.querySelectorAll('.ba-col video'));
  if(baVids.length===2){
    var rate=0.5;
    baVids.forEach(function(v){ try{v.playbackRate=rate;}catch(e){} v.addEventListener('loadedmetadata',function(){try{v.playbackRate=rate;}catch(e){}}); });
    var play=document.getElementById('ba-play');
    play.onclick=function(){
      var on=baVids.some(function(v){return !v.paused;});
      if(on){ baVids.forEach(function(v){v.pause();}); play.textContent='▶ 동시 재생'; }
      else{ baVids.forEach(function(v){v.play().catch(function(){});}); play.textContent='⏸ 일시정지'; }
    };
    document.getElementById('ba-restart').onclick=function(){
      baVids.forEach(function(v){ try{v.currentTime=0;}catch(e){} v.play().catch(function(){}); });
      play.textContent='⏸ 일시정지';
    };
    [].slice.call(document.querySelectorAll('.ba-sp')).forEach(function(b){
      b.onclick=function(){ rate=parseFloat(b.getAttribute('data-sp'))||1;
        baVids.forEach(function(v){try{v.playbackRate=rate;}catch(e){}});
        [].slice.call(document.querySelectorAll('.ba-sp')).forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); };
    });
  }
}

// ===== 데이터 로드 =====
(async function(){
  var cfg=window.APP_CONFIG||{};
  var id=new URLSearchParams(location.search).get('id');
  if(!id){ document.getElementById('loading').innerHTML='<div class="error">리포트 주소가 올바르지 않습니다.</div>'; return; }
  if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY){ document.getElementById('loading').innerHTML='<div class="error">설정 오류</div>'; return; }
  try{
    var client=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
    var r=await client.from('reports').select('*').eq('id',id).single();
    if(r.error||!r.data) throw new Error('리포트를 찾을 수 없습니다. 담당 지도자에게 새 링크를 요청해주세요.');
    try{ document.title=r.data.member_name+' 성과 리포트'; }catch(e){}
    renderReport(r.data.content||{}, {memberName:r.data.member_name, createdBy:r.data.created_by, createdAt:r.data.created_at||''});
  }catch(e){
    document.getElementById('loading').innerHTML='<div class="error">'+String(e&&e.message||e)+'</div>';
  }
})();
</script>
</body>
</html>
