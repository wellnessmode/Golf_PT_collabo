<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1f17">
<meta name="robots" content="noindex, nofollow">
<title>골프 성장기</title>
<style>
/* ============================================================
   회원용 리포트 v2 — "나의 골프 성장기" (폰 우선 · 큰 글씨 · 단순)
   원칙: 글자는 기본부터 크고 진하게(돋보기 없이도 읽힘), 버튼은 엄지 크기(48px+),
         화면에 들어가면 바로 보이게(접힘 최소), 장식 최소.
   버튼 글자는 px 고정(글자 크게를 눌러도 버튼이 깨지지 않게), 본문·숫자만 rem 으로 커진다.
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
:root{--ac:#00b884;--ac2:#00d29a;--acd:#0d6f4a;--pro:#2f6fe6;--amber:#b8650a;--red:#e35d4f;
  --tx:#0d1114;--tx2:#3a414a;--tx3:#5f6771;--bg:#f2f4f6;--card:#fff;--brd:rgba(13,20,28,.09);
  --r:18px;--shadow:0 2px 14px rgba(10,20,30,.06)}
html{-webkit-text-size-adjust:100%;font-size:17px}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Pretendard','Noto Sans KR',sans-serif;
  background:var(--bg);color:var(--tx);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;line-height:1.2;word-break:keep-all}
.report{max-width:600px;margin:0 auto;padding-bottom:40px}
/* ── 히어로 ── */
.hero{background:linear-gradient(158deg,#0b241a 0%,#0b1f17 46%,#081410 100%);color:#fff;
  padding:calc(env(safe-area-inset-top) + 22px) 22px 30px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 55% at 82% 8%,rgba(0,210,154,.2),transparent 65%);pointer-events:none}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;position:relative;z-index:1}
.hero-brand{font-size:.75rem;font-weight:800;letter-spacing:.14em;color:var(--ac2);text-transform:uppercase}
.hero-zoom{min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;font-size:15px;font-weight:900;cursor:pointer;white-space:nowrap}
.hero-zoom small{color:var(--ac2);font-size:14px;font-weight:900;margin-left:4px}
.hero-title{font-size:1.9rem;font-weight:900;letter-spacing:-.03em;line-height:1.2;position:relative;z-index:1}
.hero-title small{display:block;font-size:1.05rem;font-weight:700;color:rgba(255,255,255,.72);letter-spacing:0;margin-top:6px}
.hero-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:18px;position:relative;z-index:1}
@media (min-width:480px){ .hero-stats{grid-template-columns:repeat(4,1fr)} }
.hs{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 14px;min-width:0}
.hs b{display:block;font-size:1.35rem;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.hs span{font-size:.8rem;font-weight:700;color:rgba(255,255,255,.75)}
.hero-goal{display:inline-block;margin-top:16px;font-size:.95rem;font-weight:800;color:#ffd9a0;max-width:100%;
  background:rgba(240,161,58,.16);border:1px solid rgba(240,161,58,.35);border-radius:14px;padding:9px 14px;line-height:1.4;position:relative;z-index:1}
.demo-ribbon{display:inline-block;margin-top:14px;margin-right:8px;font-size:.85rem;font-weight:800;color:#0b1f17;background:#ffd769;border-radius:999px;padding:7px 14px;position:relative;z-index:1}
.hero-upd{margin-top:14px;font-size:.85rem;color:rgba(255,255,255,.62);font-weight:600;position:relative;z-index:1}
/* ── 섹션 카드 ── */
.sec{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:14px 12px 0;padding:20px 16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sec-t{font-size:1.3rem;font-weight:900;letter-spacing:-.02em}
.sec-t i{font-style:normal;margin-right:6px}
.sec-x{font-size:.85rem;color:var(--tx3);font-weight:700;text-align:right}
.empty{padding:26px 10px;text-align:center;color:var(--tx3);font-size:1rem;font-weight:700;line-height:1.6;background:var(--bg);border-radius:14px}
/* ── 클럽 드롭다운 ── */
.club-sel{position:relative}
.club-sel select{width:100%;min-height:58px;font-size:20px;font-weight:900;color:var(--tx);background:var(--bg);
  border:2px solid rgba(0,184,132,.55);border-radius:16px;padding:10px 54px 10px 18px;appearance:none;-webkit-appearance:none;font-family:inherit;letter-spacing:-.01em}
.club-sel::after{content:"▼";position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--acd);pointer-events:none;font-weight:900}
.club-hint{margin-top:8px;font-size:.85rem;color:var(--tx3);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media (min-width:480px){ .tiles{grid-template-columns:repeat(4,1fr)} }
.tile{background:var(--bg);border-radius:16px;padding:14px 14px 12px;min-width:0}
.tile-l{font-size:.85rem;color:var(--tx3);font-weight:800}
.tile-v{font-size:1.9rem;font-weight:900;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums;margin-top:2px}
.tile-v small{font-size:.9rem;color:var(--tx3);font-weight:800;margin-left:2px}
.tile-v.green{color:var(--acd)}
.tile-s{font-size:.8rem;color:var(--tx3);font-weight:700;margin-top:2px}
.chart{margin-top:16px;background:var(--bg);border-radius:16px;padding:12px 10px 6px}
.chart-t{font-size:.95rem;font-weight:900;color:var(--tx2);padding:0 6px 4px}
.chart svg{width:100%;height:auto;display:block}
.day-h{margin:20px 0 8px;font-size:1.05rem;font-weight:900;color:var(--tx);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.day-h small{font-size:.85rem;color:var(--tx3);font-weight:700}
.shot{border:1.5px solid var(--brd);border-radius:16px;padding:12px 14px;margin-bottom:10px;background:var(--card)}
.shot-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.shot-time{font-size:.95rem;font-weight:800;color:var(--tx2);font-variant-numeric:tabular-nums}
.shot-club{font-size:.95rem;font-weight:800;color:var(--tx3)}
.tag{font-size:13px;font-weight:900;letter-spacing:.06em;padding:4px 10px;border-radius:999px;color:#fff}
.tag.b{background:var(--amber)} .tag.a{background:var(--acd)}
.shot-nums{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;align-items:baseline}
.sn{font-size:.85rem;color:var(--tx3);font-weight:800}
.sn b{display:block;font-size:1.45rem;color:var(--tx);font-weight:900;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.sn b small{font-size:.8rem;color:var(--tx3);font-weight:800}
.sn.main b{color:var(--acd);font-size:1.7rem}
.shot-more{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:.85rem;color:var(--tx3);font-weight:700}
.angles{display:flex;gap:8px;margin-top:12px}
.ang{flex:1;min-height:52px;padding:8px 6px;border-radius:14px;border:none;background:var(--tx);color:#fff;font-size:17px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.ang.fo{background:var(--pro)} .ang.cl{background:#5a4a20}
.ang:active{transform:scale(.97)}
.more-btn{width:100%;min-height:54px;padding:10px 12px;margin-top:6px;border-radius:14px;border:2px solid var(--brd);background:var(--card);color:var(--tx2);font-size:18px;font-weight:900;cursor:pointer}
/* ── 비포 · 애프터 ── */
.ba-day{border:1.5px solid var(--brd);border-radius:18px;margin-bottom:14px;overflow:hidden;background:var(--card)}
.ba-day:last-child{margin-bottom:0}
.ba-dh{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;min-height:60px;flex-wrap:wrap}
.ba-dd{font-size:1.15rem;font-weight:900;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.ba-ds{font-size:.85rem;color:var(--tx3);font-weight:800}
.ba-pro{font-size:13px;font-weight:900;color:#fff;background:var(--pro);border-radius:999px;padding:4px 10px}
.ba-arw{margin-left:auto;flex-shrink:0;min-height:40px;padding:6px 14px;border-radius:999px;border:2px solid var(--brd);background:var(--bg);color:var(--tx2);font-size:16px;font-weight:900;display:flex;align-items:center;white-space:nowrap}
.ba-day.open .ba-arw{background:var(--acd);border-color:transparent;color:#fff}
.ba-day.open .ba-dd{color:var(--acd)}
.ba-day .ba-b{display:none;padding:0 14px 16px}
.ba-day.open .ba-b{display:block}
.ba-clubs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ba-cc{min-height:46px;padding:8px 18px;border-radius:999px;border:2px solid var(--brd);background:var(--bg);color:var(--tx2);font-weight:900;font-size:17px;cursor:pointer}
.ba-cc.on{background:var(--acd);border-color:transparent;color:#fff}
.ba-pane{display:none}
.ba-pane.on{display:block}
.ba-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ba-col{border-radius:16px;overflow:hidden;background:#000;position:relative}
.ba-lab{display:flex;align-items:center;justify-content:center;min-height:40px;font-size:18px;font-weight:900;letter-spacing:.1em;color:#fff}
.ba-lab.b{background:var(--amber)} .ba-lab.a{background:var(--acd)}
.ba-col video{display:block;width:100%;aspect-ratio:9/14;object-fit:cover;background:#000}
.ba-cap{background:#15191e;color:#fff;font-size:.95rem;font-weight:800;padding:9px 8px;text-align:center;line-height:1.3}
.ba-cap small{display:block;font-size:.8rem;color:rgba(255,255,255,.7);font-weight:700}
.ba-big{display:block;width:100%;min-height:46px;padding:8px;border:none;background:#2a3038;color:#fff;font-size:16px;font-weight:900;cursor:pointer}
.ba-ctrl{display:grid;grid-template-columns:1.6fr 1fr;gap:8px;margin-top:12px}
.ba-btn{min-height:56px;padding:10px 12px;border-radius:16px;border:none;background:var(--tx);color:#fff;font-weight:900;font-size:19px;cursor:pointer}
.ba-btn.play{background:var(--acd)}
.ba-speeds{display:flex;gap:8px;margin-top:10px}
.ba-sp{flex:1;min-height:46px;padding:8px 4px;border-radius:12px;border:2px solid var(--brd);background:var(--bg);color:var(--tx2);font-weight:900;font-size:16px;cursor:pointer}
.ba-sp.on{background:var(--acd);border-color:transparent;color:#fff}
.ba-seekrow{display:flex;align-items:center;gap:10px;margin-top:8px;padding:0 2px}
.ba-time{font-size:.85rem;color:var(--tx3);font-weight:800;font-variant-numeric:tabular-nums;min-width:40px;text-align:center}
.ba-seek{flex:1;-webkit-appearance:none;appearance:none;height:44px;background:linear-gradient(rgba(13,20,28,.16),rgba(13,20,28,.16)) center/100% 8px no-repeat;border-radius:999px;outline:none;margin:0}
.ba-seek::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:34px;height:34px;border-radius:50%;background:var(--acd);border:3px solid #fff;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.ba-seek::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:var(--acd);border:3px solid #fff;cursor:pointer}
.ba-delta{margin-top:12px;text-align:center;font-size:1.05rem;font-weight:800;color:var(--acd);
  background:linear-gradient(135deg,#eefaf4,#e4f6ee);border:1.5px solid rgba(0,184,132,.25);border-radius:14px;padding:12px}
.ba-delta b{font-size:1.3rem;font-weight:900}
.ba-dlrow{display:flex;gap:8px;margin-top:10px}
.dl-btn{flex:1;min-height:50px;padding:8px 10px;border-radius:14px;border:2px solid var(--brd);background:var(--bg);color:var(--tx2);font-weight:900;font-size:16px;cursor:pointer}
.dl-btn:disabled{opacity:.6}
.ba-one .ba-onev{border-radius:16px;overflow:hidden;background:#000}
.ba-one video{display:block;width:100%;max-height:460px;object-fit:contain;background:#000}
/* ── 레슨 일지 ── */
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;min-height:56px;padding:10px 8px;border-radius:16px;border:2px solid var(--brd);background:var(--bg);color:var(--tx2);font-weight:900;font-size:18px;cursor:pointer}
.tab.pro.on{background:var(--pro);border-color:transparent;color:#fff}
.tab.pt.on{background:var(--acd);border-color:transparent;color:#fff}
.tab-pane{display:none}
.tab-pane.on{display:block}
.log{border:1.5px solid var(--brd);border-radius:16px;padding:14px;margin-bottom:12px;background:var(--card)}
.log-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.log-date{font-size:1.05rem;font-weight:900;font-variant-numeric:tabular-nums}
.log-who{font-size:.9rem;font-weight:800;color:var(--tx3)}
.log-body{font-size:1.02rem;color:var(--tx2);line-height:1.75;word-break:keep-all;overflow-wrap:anywhere;background:var(--bg);border-radius:14px;padding:13px 15px}
.log-body .md-h{font-size:1rem;font-weight:900;color:var(--tx);margin:10px 0 5px}
.log-body .md-h:first-child{margin-top:0}
.log-body .md-ul{margin:2px 0 6px;padding-left:18px}
.log-body .md-ul li{margin-bottom:4px}
.log-body .md-ul li::marker{color:var(--acd)}
.log-body .md-p{margin-bottom:6px}
.log-body .md-p:last-child,.log-body .md-ul:last-child{margin-bottom:0}
.log-body b{color:var(--tx);font-weight:900}
.log-video{margin-top:10px;border-radius:14px;overflow:hidden;background:#000}
.log-video video{display:block;width:100%;aspect-ratio:9/16;max-height:380px;object-fit:contain}
.log-dl{margin-top:8px}
.log-dl .dl-btn{width:100%}
.note{margin-top:14px;font-size:.85rem;color:var(--tx3);line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;background:var(--bg);border-radius:12px;padding:10px 12px;font-weight:600}
.foot{text-align:center;padding:30px 20px 10px;color:var(--tx3);font-size:.85rem;line-height:1.8;font-weight:600}
.foot b{color:var(--tx2);font-size:1rem}
/* ── 영상 뷰어 (전체 화면 오버레이) ── */
.vw{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column;color:#fff;touch-action:none;overscroll-behavior:contain}
.vw.on{display:flex}
.vw-top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 8px}
.vw-title{flex:1;font-size:1.05rem;font-weight:900;line-height:1.25;min-width:0}
.vw-title small{display:block;font-size:.85rem;color:rgba(255,255,255,.75);font-weight:700}
.vw-x{width:50px;height:50px;flex-shrink:0;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:24px;font-weight:900;cursor:pointer}
.vw-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;touch-action:auto}
.vw-stage video{width:100%;height:100%;object-fit:contain;background:#000}
.vw-nav{position:absolute;top:40%;transform:translateY(-50%);min-width:56px;min-height:76px;padding:6px;border:none;border-radius:14px;background:rgba(0,0,0,.5);color:#fff;font-size:15px;font-weight:900;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.vw-nav b{font-size:30px;line-height:1}
.vw-nav.prev{left:6px} .vw-nav.next{right:6px}
.vw-nav:disabled{opacity:.25}
.vw-bot{padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);touch-action:auto}
.vw-angles{display:flex;gap:8px}
.vw-ang{flex:1;min-height:54px;padding:8px;border-radius:14px;border:2px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-size:18px;font-weight:900;cursor:pointer}
.vw-ang.on{background:var(--acd);border-color:transparent}
.vw-ang:disabled{opacity:.3}
.vw-acts{display:flex;gap:8px;margin-top:10px}
.vw-act{flex:1;min-height:52px;padding:8px;border-radius:14px;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:17px;font-weight:900;cursor:pointer}
.vw-cnt{text-align:center;font-size:.9rem;color:rgba(255,255,255,.75);font-weight:800;margin-top:10px}
@media (orientation:landscape) and (max-height:500px){
  .vw{flex-direction:row;flex-wrap:wrap}
  .vw-top{width:100%}
  .vw-stage{flex:1 1 55%;min-height:0}
  .vw-bot{flex:1 1 40%;max-width:45%;display:flex;flex-direction:column;justify-content:center}
}
.loading{text-align:center;padding:90px 20px;color:var(--tx3);font-size:1rem;font-weight:700}
.spinner{width:34px;height:34px;border:3px solid var(--brd);border-top-color:var(--ac);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.error{text-align:center;padding:90px 20px;color:#c0392b;font-weight:800;font-size:1.05rem}
</style>
</head>
<body>
<div class="report" id="report">
  <div class="loading" id="loading"><div class="spinner"></div><div>리포트를 불러오는 중...</div></div>
</div>
<div class="vw" id="vw" role="dialog" aria-label="스윙 영상">
  <div class="vw-top"><div class="vw-title" id="vw-title"></div><button class="vw-x" onclick="vwClose()" aria-label="닫기">✕</button></div>
  <div class="vw-stage"><button class="vw-nav prev" id="vw-prev" onclick="vwStep(-1)" aria-label="이전 샷"><b>‹</b>이전</button><video id="vw-video" controls playsinline preload="metadata"></video><button class="vw-nav next" id="vw-next" onclick="vwStep(1)" aria-label="다음 샷"><b>›</b>다음</button></div>
  <div class="vw-bot">
    <div class="vw-angles"><button class="vw-ang" data-a="dl" onclick="vwAngle('dl')">측면</button><button class="vw-ang" data-a="fo" onclick="vwAngle('fo')">정면</button><button class="vw-ang" data-a="clubv" onclick="vwAngle('clubv')">클럽</button></div>
    <div class="vw-acts"><button class="vw-act" id="vw-full" onclick="vwFull()">⤢ 전체 화면</button><button class="vw-act" id="vw-dl" onclick="rptDownload(this)">⬇ 저장</button></div>
    <div class="vw-cnt" id="vw-cnt"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
// ===== 렌더 (데이터 → 화면). 테스트를 위해 전역 함수로 분리 =====
var __RPT={ byClub:[], club:null, shown:{}, baPanes:[], vw:{ list:[], i:0, angle:'dl' }, lock:null };
var CLUB_KEYS=/^(driver|wood|hybrid|iron|wedge|putter|other)$/;
function renderReport(c, meta){
  var cfg=window.APP_CONFIG||{};
  // 자체 주소(워커)에서 열린 경우: 데이터가 서버에서 주입되고(window.__REPORT__), 영상은 같은 주소에서 스트리밍.
  // 예전 방식(report.html?id=)으로 열린 경우: config 의 워커 주소를 사용(하위 호환).
  var boot=!!window.__REPORT__;
  var r2base=boot ? '' : (cfg.R2_WORKER_URL||null);
  var canVid=(r2base!==null);
  window.__R2BASE=r2base;
  var BR=Object.assign({name:'GOLF STUDIO', nameKo:'골프 스튜디오', measuredBy:'TRACKMAN'}, cfg.BRAND||{}, (c&&c.brand)||{});
  var storeKo=BR.store||BR.nameKo, storeEn=BR.storeEn||BR.name;
  var esc=__esc, fmt=__fmt, vurl=__vurl, fmtDay=__fmtDay, num=__num;
  var m=c.member||{}, t=c.trackman||null;
  var name=String(meta.memberName||m.name||'');

// ───────── 도우미 ─────────
function __esc(x){ return String(x==null?'':x).replace(/[<>&"']/g,function(ch){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[ch];}); }
function __num(v){ var n=Number(v); return isFinite(n)?n:0; }
function __fmt(v,dec){ if(v==null||isNaN(v)) return '—'; return Number(v).toFixed(dec!=null?dec:0); }
function __fmtU(v,unit,dec){ if(v==null||isNaN(v)) return '<span style="color:var(--tx3)">기록 없음</span>'; return __fmt(v,dec)+'<small>'+unit+'</small>'; }
function __vurl(k){ return (window.__R2BASE||'')+'/'+encodeURIComponent(k); }
function __fmtDay(day){ try{ var d=new Date(String(day)+'T00:00:00'); var w=['일','월','화','수','목','금','토'][d.getDay()]; return String(day).replace(/-/g,'.')+(w?' ('+w+')':''); }catch(e){ return String(day); } }
function __hm(ts){ try{ var d=new Date(ts); if(isNaN(d.getTime())) return ''; var h=d.getHours(), mi=d.getMinutes(); return (h<10?'0':'')+h+':'+(mi<10?'0':'')+mi; }catch(e){ return ''; } }

function __playable(k){ return !!k && !/\.mkv$/i.test(String(k)); }   // 트랙맨 원본(.mkv)은 폰에서 재생 불가
// 경량 마크다운 → HTML — AI 정리 일지의 "## 제목 / - 불릿 / **볼드**"
function __md(txt){
  var out=[], inUl=false, esc=__esc;
  String(txt||'').split('\n').forEach(function(ln){
    var t=ln.trim(); var body=esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
    if(/^##\s+/.test(t)){ if(inUl){out.push('</ul>');inUl=false;} out.push('<div class="md-h">'+body.replace(/^##\s+/,'')+'</div>'); }
    else if(/^[-•·]\s+/.test(t)){ if(!inUl){out.push('<ul class="md-ul">');inUl=true;} out.push('<li>'+body.replace(/^[-•·]\s+/,'')+'</li>'); }
    else if(t===''){ if(inUl){out.push('</ul>');inUl=false;} }
    else { if(inUl){out.push('</ul>');inUl=false;} out.push('<div class="md-p">'+body+'</div>'); }
  });
  if(inUl) out.push('</ul>');
  return out.join('');
}
// 캐리 성장 그래프 — 폰 폭 기준 viewBox(360) 라 글자가 실제로 크게 보인다
function __line(vals,labels){
  var W=360,H=170,pad={t:30,r:16,b:30,l:38},n=vals.length;
  if(n<2) return '';
  var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals); if(min===max){min-=1;max+=1;}
  var iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  var X=function(i){return pad.l+iw*i/(n-1);},Y=function(v){return pad.t+ih*(1-(v-min)/(max-min));};
  var pts=vals.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1);}).join(' ');
  var area='M '+pts.split(' ').join(' L ')+' L '+X(n-1).toFixed(1)+','+(pad.t+ih)+' L '+X(0).toFixed(1)+','+(pad.t+ih)+' Z';
  var dots=vals.map(function(v,i){var last=i===n-1;return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+(last?6:3.5)+'" fill="'+(last?'#0d6f4a':'#fff')+'" stroke="#0d6f4a" stroke-width="'+(last?0:2.4)+'"/>'
    +(last||i===0?'<text x="'+X(i).toFixed(1)+'" y="'+(Y(v)-11).toFixed(1)+'" text-anchor="'+(last?'end':'start')+'" font-size="15" font-weight="800" fill="#0d6f4a">'+Math.round(v)+'m</text>':'');}).join('');
  var idxs=n<=4?labels.map(function(_,i){return i;}):[0,Math.floor((n-1)/2),n-1];
  var xl=idxs.map(function(i){var anc=i===0?'start':(i===n-1?'end':'middle');return '<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+anc+'" font-size="14" font-weight="700" fill="#5f6771">'+__esc(labels[i])+'</text>';}).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="캐리 추이">'
    +'<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(0,184,132,.2)"/><stop offset="100%" stop-color="rgba(0,184,132,0)"/></linearGradient></defs>'
    +'<path d="'+area+'" fill="url(#ga)"/><polyline fill="none" stroke="#0d6f4a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" points="'+pts+'"/>'+dots+xl+'</svg>';
}
// 기본 선택 클럽 — 가장 최근에 친 클럽 (없으면 첫 그룹)
function __defaultClub(byClub){

  var names={driver:'드라이버',wood:'우드',hybrid:'유틸리티',iron:'아이언',wedge:'웨지',putter:'퍼터'};
  var gof=function(nm){ var n=String(nm||'').toLowerCase();
    if(/드라이버|driver/.test(n)) return 'driver'; if(/하이브리드|hybrid|유틸|utility/.test(n)) return 'hybrid'; if(/우드|wood/.test(n)) return 'wood';
    if(/웨지|wedge|피칭|pitch|샌드|sand/.test(n)) return 'wedge'; if(/퍼터|putter/.test(n)) return 'putter'; return 'iron'; };
  var pk=function(k){ return __playable(k)?k:null; };
  (t.videos||[]).forEach(function(v){ var g=gof(v.club); (groups[g]=groups[g]||[]).push({ts:v.ts, club:v.club||'', tag:v.tag||null, dl:pk(v.dl), fo:pk(v.fo), clubv:pk(v.clubv), carry:__distM(v.carry,v.metric)}); });

  return order.filter(function(k){ return groups[k]; }).map(function(k){ var L=(groups[k]||[]).slice().sort(function(x,y){return String(y.ts).localeCompare(String(x.ts));});
    return { key:k, name:names[k], n:groups[k]._n||L.length, nVideo:L.filter(function(s){return s.dl||s.fo||s.clubv;}).length, avg:groups[k]._avg||{}, best:null, trend:[], shots:L, legacy:true }; });

// ── 영상 다운로드 — 아이폰: 공유시트(사진 앱에 저장) · 갤럭시/PC: 파일 다운로드 ──
// 아이폰의 공유시트는 탭 직후에만 열 수 있어, 1탭: 내려받기 → 2탭: '📲 사진에 저장' 으로 공유시트.
function __isIOS(){ return /iP(hone|ad|od)/.test(navigator.userAgent||'')||(navigator.platform==='MacIntel'&&(navigator.maxTouchPoints||0)>1); }
async function rptDownload(btn){
  var key=btn.getAttribute('data-k'), name=btn.getAttribute('data-n')||'video';
  if(!key||btn._busy) return;
  var base=window.__R2BASE;
  if(base==null){ alert('영상 다운로드를 사용할 수 없습니다.'); return; }
  var isIOS=__isIOS() && !!navigator.canShare && typeof File!=='undefined';
  if(isIOS && btn._file && btn._fileKey===key){
    try{ if(navigator.canShare({files:[btn._file]})){ await navigator.share({files:[btn._file]}); btn.innerHTML='✅ 완료'; setTimeout(function(){ btn.innerHTML='⬇ 저장'; btn._file=null; },1800); return; } }
    catch(e){ if(e&&e.name==='AbortError') return; btn.innerHTML='📲 사진에 저장 (다시 탭)'; return; }
  }
  var url=(base||'')+'/'+encodeURIComponent(key);
  var extM=String(key).match(/\.(mp4|mov|webm|m4v)$/i);
  var fname=(name.replace(/[\\/:*?"<>|]/g,'_'))+'.'+(extM?extM[1].toLowerCase():'mp4');
  var orig=btn.innerHTML; btn._busy=1; btn.disabled=true;
  function restore(txt){ btn.innerHTML=txt||orig; btn._busy=0; btn.disabled=false; if(txt) setTimeout(function(){ btn.innerHTML=orig; },1800); }
  try{
    btn.innerHTML='0%';
    var res=await fetch(url);
    if(!res.ok) throw new Error('다운로드 실패 ('+res.status+')');
    var total=parseInt(res.headers.get('content-length')||'0',10), got=0, chunks=[], blob;
    var reader=(res.body&&res.body.getReader)?res.body.getReader():null;
    if(reader){
      while(true){ var c=await reader.read(); if(c.done) break; chunks.push(c.value); got+=c.value.length; if(total) btn.innerHTML=Math.min(99,Math.round(got/total*100))+'%'; }
      blob=new Blob(chunks,{type:'video/mp4'});
    } else blob=await res.blob();
    if(isIOS){
      var f=new File([blob],fname,{type:'video/mp4'});
      btn._file=f; btn._fileKey=key; btn._busy=0; btn.disabled=false; btn.innerHTML='📲 사진에 저장 (한 번 더 탭)';
      return;
    }
    var bu=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=bu; a.download=fname;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{URL.revokeObjectURL(bu); a.remove();}catch(e){} },1500);
    restore('✅ 완료');
  }catch(e){ alert('영상 다운로드에 실패했습니다 — '+(e&&e.message||e)); restore(); }
}

// ── 비포·애프터 컨트롤 배선 — 함께 재생 · 공용 시크바 · 느리게 ──
function wireBA(root){
  if(!root || root.getAttribute('data-ba-wired')) return;
  root.setAttribute('data-ba-wired','1');
  var baVids=[].slice.call(root.querySelectorAll('.ba-grid video'));
  if(baVids.length!==2) return;
  var rate=1, master=baVids[0], dragging=false;
  var seek=root.querySelector('.ba-seek'), curEl=root.querySelector('.ba-time[data-role="cur"]'), durEl=root.querySelector('.ba-time[data-role="dur"]');
  var play=root.querySelector('.ba-play'), restart=root.querySelector('.ba-restart');
  if(!seek||!curEl||!durEl||!play||!restart) return;
  function ft(x){ return (Math.round(x*10)/10).toFixed(1)+'s'; }
  baVids.forEach(function(v){ try{v.playbackRate=rate;}catch(e){} v.addEventListener('loadedmetadata',function(){try{v.playbackRate=rate;}catch(e){}}); });
  master.addEventListener('loadedmetadata', function(){ if(isFinite(master.duration)) durEl.textContent=ft(master.duration); });
  master.addEventListener('timeupdate', function(){ if(dragging||!isFinite(master.duration)||!master.duration) return; seek.value=Math.round(master.currentTime/master.duration*1000); curEl.textContent=ft(master.currentTime); });
  function seekBoth(){ var pct=(parseInt(seek.value,10)||0)/1000; baVids.forEach(function(v){ if(isFinite(v.duration)&&v.duration){ try{v.currentTime=v.duration*pct;}catch(e){} } }); if(isFinite(master.duration)&&master.duration) curEl.textContent=ft(master.duration*pct); }
  var wasPlaying=false;
  seek.addEventListener('input', function(){ if(!dragging){ dragging=true; wasPlaying=baVids.some(function(v){return !v.paused;}); baVids.forEach(function(v){v.pause();}); } seekBoth(); });
  seek.addEventListener('change', function(){ seekBoth(); dragging=false; if(wasPlaying){ baVids.forEach(function(v){v.play().catch(function(){});}); play.textContent='⏸ 멈춤'; } wasPlaying=false; });
  play.onclick=function(){ var on=baVids.some(function(v){return !v.paused;}); if(on){ baVids.forEach(function(v){v.pause();}); play.textContent='▶ 함께 재생'; } else{ baVids.forEach(function(v){v.play().catch(function(){});}); play.textContent='⏸ 멈춤'; } };
  restart.onclick=function(){ baVids.forEach(function(v){ try{v.currentTime=0;}catch(e){} v.play().catch(function(){}); }); seek.value=0; play.textContent='⏸ 멈춤'; };
  [].slice.call(root.querySelectorAll('.ba-sp')).forEach(function(b){ b.onclick=function(){ rate=parseFloat(b.getAttribute('data-sp'))||1; baVids.forEach(function(v){try{v.playbackRate=rate;}catch(e){}}); [].slice.call(root.querySelectorAll('.ba-sp')).forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); }; });
}

// ===== 데이터 로드 =====
(async function(){
  var boot=window.__REPORT__;
  if(boot && boot.content){
    try{ document.title=(boot.member_name||'')+'님의 골프 성장기'; }catch(e){}
    renderReport(boot.content||{}, {memberName:boot.member_name||'', createdBy:boot.created_by||'', createdAt:boot.created_at||''});
    return;
  }
  var cfg=window.APP_CONFIG||{};
  var id=new URLSearchParams(location.search).get('id');
  if(!id){ document.getElementById('loading').innerHTML='<div class="error">리포트 주소가 올바르지 않습니다.</div>'; return; }
  if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY){ document.getElementById('loading').innerHTML='<div class="error">설정 오류</div>'; return; }
  try{
    var client=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
    var r=await client.from('reports').select('*').eq('id',id).single();
    if(r.error||!r.data) throw new Error('리포트를 찾을 수 없습니다. 담당 지도자에게 새 링크를 요청해주세요.');
    try{ document.title=r.data.member_name+'님의 골프 성장기'; }catch(e){}
    renderReport(r.data.content||{}, {memberName:r.data.member_name, createdBy:r.data.created_by, createdAt:r.data.created_at||''});
  }catch(e){ document.getElementById('loading').innerHTML='<div class="error">'+String(e&&e.message||e)+'</div>'; }
})();
</script>
