<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Golf PT — 내셔널짐</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#11151a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Golf PT">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png?v=2">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app" id="root"></div>

<!-- Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 앱 설정 -->
<script src="config.js"></script>

<!-- DB -->
<script src="js/exercises_data.js"></script>
<script src="js/golf_lesson_data.js"></script>

<!-- 앱 로직 (4-module split) -->
<script src="js/app_core.js"></script>
<script src="js/app_render.js"></script>
<script src="js/app_handlers.js"></script>
<script src="js/app_ai.js"></script>
<script src="js/app_dashboard.js"></script>
<script src="js/app_live.js"></script>

<!-- Service Worker -->
<script>
// SW 등록 + 백그라운드 업데이트 (새 버전은 다음 앱 실행 때 자연 적용)
// ※ 자동 location.reload() 안 함 — 강제 리로드가 흰 화면을 유발했었음.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(function(reg){
    try{ reg.update(); }catch(e){}
    // 새 버전 설치되면 대기시킴(skipWaiting). 사용자가 다음에 앱 열 때 적용됨.
    reg.addEventListener('updatefound', function(){
      var nw = reg.installing;
      if(!nw) return;
      nw.addEventListener('statechange', function(){
        if(nw.state === 'installed' && navigator.serviceWorker.controller){
          try{ nw.postMessage({type:'SKIP_WAITING'}); }catch(e){}
          // 알림만, 강제 reload 안 함
          try{ if(window.__onSwUpdate) window.__onSwUpdate(); }catch(e){}
        }
      });
    });
  }).catch(function(e){ console.log('SW registration failed:', e); });
  // 30분마다 백그라운드 업데이트 체크 (reload 없음)
  setInterval(function(){
    navigator.serviceWorker.getRegistration().then(function(r){ if(r) r.update(); }).catch(function(){});
  }, 30*60*1000);
}
</script>
</body>
</html>
