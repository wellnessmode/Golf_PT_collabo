<!-- Service Worker -->
<script>
// SW 등록 + 업데이트 배너 방식.
// 새 버전 감지 → 상단에 "업데이트" 배너 → 사용자가 누를 때 1회 reload (흰 화면 방지).
(function(){
  if (!('serviceWorker' in navigator)) return;
  var pendingWorker = null;

  function showUpdateBanner(worker){
    pendingWorker = worker;
    if (document.getElementById('sw-update-banner')) return;
    var b = document.createElement('div');
    b.id = 'sw-update-banner';
    b.innerHTML = '<span>새 버전이 있어요</span><button id="sw-update-btn">업데이트</button>';
    b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom));z-index:100000;background:#0d1117;color:#fff;border-radius:24px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.4);font:600 13px -apple-system,sans-serif';
    var btnStyle = 'background:#00b884;color:#fff;border:none;border-radius:18px;padding:8px 16px;font:700 13px -apple-system,sans-serif;cursor:pointer';
    b.querySelector('#sw-update-btn').style.cssText = btnStyle;
    document.body.appendChild(b);
    document.getElementById('sw-update-btn').addEventListener('click', function(){
      try{ if(pendingWorker) pendingWorker.postMessage({type:'SKIP_WAITING'}); }catch(e){}
      b.querySelector('#sw-update-btn').textContent = '적용 중...';
    });
  }

  // 새 SW가 컨트롤 잡으면 그때 1회 reload (사용자가 버튼 눌렀을 때만 도달)
  var reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (reloaded) return; reloaded = true;
    location.reload();
  });

  navigator.serviceWorker.register('sw.js').then(function(reg){
    // 이미 대기 중인 새 SW가 있으면 즉시 배너
    if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner(reg.waiting);
    try{ reg.update(); }catch(e){}
    reg.addEventListener('updatefound', function(){
      var nw = reg.installing;
      if(!nw) return;
      nw.addEventListener('statechange', function(){
        if(nw.state === 'installed' && navigator.serviceWorker.controller){
          showUpdateBanner(nw);
        }
      });
    });
  }).catch(function(e){ console.log('SW registration failed:', e); });

  // 앱 다시 포커스될 때 + 15분마다 업데이트 체크
  function checkUpdate(){ navigator.serviceWorker.getRegistration().then(function(r){ if(r) r.update(); }).catch(function(){}); }
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) checkUpdate(); });
  setInterval(checkUpdate, 15*60*1000);
})();
</script>
</body>
</html>
