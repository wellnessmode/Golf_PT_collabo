<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golf PT Collaboration — 내셔널짐</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;background:#f4f1eb;color:#1a1a1a;height:100vh;overflow:hidden}
.app{display:flex;height:100vh}

/* Sidebar */
.sidebar{width:220px;min-width:220px;background:#fff;border-right:1px solid #e8e3d8;display:flex;flex-direction:column;overflow:hidden}
.sidebar-logo{padding:16px 14px 12px;border-bottom:1px solid #e8e3d8;display:flex;align-items:center;gap:8px}
.logo-mark{width:28px;height:28px;background:#1a3d2b;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;flex-shrink:0}
.logo-text{font-size:12px;font-weight:600;color:#1a3d2b;line-height:1.3}
.logo-sub{font-size:10px;color:#7a8a80;font-weight:400}
.sidebar-section-label{padding:10px 14px 4px;font-size:10px;font-weight:600;color:#9ca89e;letter-spacing:.06em;text-transform:uppercase}
.member-list{flex:1;overflow-y:auto;padding:4px 8px}
.member-item{padding:8px 8px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px;margin-bottom:1px;transition:background .12s}
.member-item:hover{background:#f4f1eb}
.member-item.active{background:#eaf3de}
.member-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.av-green{background:#c0dd97;color:#3b6d11}
.av-blue{background:#b5d4f4;color:#185fa5}
.av-amber{background:#fac775;color:#854f0b}
.av-coral{background:#f5c4b3;color:#993c1d}
.member-name{font-size:13px;font-weight:500;flex:1;color:#1a1a1a}
.member-item.active .member-name{color:#2d6a4f}
.session-badge{font-size:10px;color:#9ca89e;background:#f4f1eb;padding:1px 6px;border-radius:8px;font-weight:500}
.add-member-btn{margin:8px;padding:9px 10px;border:1.5px dashed #d4cfc4;border-radius:8px;cursor:pointer;font-size:12px;color:#9ca89e;text-align:center;transition:all .15s;font-weight:500}
.add-member-btn:hover{border-color:#4a7c59;color:#2d6a4f;background:#f4f9f0}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:12px 20px;background:#fff;border-bottom:1px solid #e8e3d8;display:flex;align-items:center;justify-content:space-between}
.member-title-wrap{display:flex;align-items:center;gap:10px}
.topbar-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.member-title{font-size:16px;font-weight:600;color:#1a1a1a}
.member-subtitle{font-size:11px;color:#9ca89e;margin-top:1px}
.topbar-actions{display:flex;gap:8px}
.btn{padding:7px 14px;border-radius:8px;border:1px solid #d4cfc4;background:#fff;font-size:12px;cursor:pointer;font-weight:600;transition:all .15s;color:#3d3d3d}
.btn:hover{background:#f4f1eb;border-color:#b0aa9e}
.btn.primary{background:#1a3d2b;color:#fff;border-color:#1a3d2b}
.btn.primary:hover{background:#2d6a4f}
.btn.danger{background:#fff;color:#993c1d;border-color:#f5c4b3}
.btn.danger:hover{background:#faece7}

/* Content */
.content{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}

/* Stats */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#fff;border:1px solid #e8e3d8;border-radius:10px;padding:10px 14px;text-align:center}
.stat-val{font-size:20px;font-weight:700;line-height:1.1}
.stat-val.green{color:#3b6d11}
.stat-val.blue{color:#185fa5}
.stat-val.amber{color:#ba7517}
.stat-lbl{font-size:10px;color:#9ca89e;margin-top:3px;font-weight:500}

/* Section card */
.section-card{background:#fff;border:1px solid #e8e3d8;border-radius:12px;overflow:hidden}
.section-header{padding:11px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;border-bottom:1px solid transparent;transition:background .12s}
.section-header:hover{background:#f9f7f3}
.section-header.open{border-bottom-color:#e8e3d8}
.section-label{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;color:#1a1a1a}
.dot{width:7px;height:7px;border-radius:50%}
.dot-green{background:#639922}
.dot-amber{background:#ba7517}
.sec-count{font-size:11px;color:#9ca89e;font-weight:400}
.chevron{font-size:11px;color:#b0aa9e;transition:transform .2s;line-height:1}
.open .chevron{transform:rotate(180deg)}
.section-right{display:flex;align-items:center;gap:8px}

/* Assessment */
.assessment-grid{padding:12px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.assess-item{background:#f9f7f3;border-radius:8px;padding:10px 12px;border:1px solid #ede9df}
.assess-item.warn{background:#fef9f0;border-color:#e9c06a}
.assess-name{font-size:12px;font-weight:600;margin-bottom:2px;color:#1a1a1a}
.assess-item.warn .assess-name{color:#854f0b}
.assess-cp{font-size:10px;color:#9ca89e;margin-bottom:7px;line-height:1.4}
.assess-row{display:flex;gap:6px;align-items:center}
.assess-select{font-size:11px;border:1px solid #d4cfc4;border-radius:6px;padding:3px 6px;background:#fff;color:#1a1a1a;flex:1;cursor:pointer}
.assess-note-input{font-size:11px;border:1px solid #d4cfc4;border-radius:6px;padding:4px 7px;background:#fff;color:#1a1a1a;width:100%;margin-top:5px}
.assess-note-input::placeholder{color:#b0aa9e}

/* Sessions */
.filter-bar{display:flex;gap:6px;padding:10px 16px 0}
.filter-btn{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid #d4cfc4;cursor:pointer;background:#fff;color:#6b7a70;font-weight:500;transition:all .15s}
.filter-btn:hover{border-color:#4a7c59;color:#2d6a4f}
.filter-btn.active{background:#1a3d2b;color:#fff;border-color:#1a3d2b}
.filter-btn.pro-active{background:#185fa5;color:#fff;border-color:#185fa5}
.filter-btn.trainer-active{background:#3b6d11;color:#fff;border-color:#3b6d11}
.sessions-list{padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.session-card{border-radius:9px;border:1px solid #e8e3d8;overflow:hidden}
.session-hd{padding:8px 12px;display:flex;align-items:center;gap:8px}
.session-hd.pro{background:#eef5fd}
.session-hd.trainer{background:#eaf3de}
.role-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.02em}
.role-tag.pro{background:#b5d4f4;color:#185fa5}
.role-tag.trainer{background:#c0dd97;color:#3b6d11}
.session-author{font-size:12px;font-weight:600;color:#1a1a1a}
.session-date{font-size:11px;color:#9ca89e}
.supp-badge{margin-left:auto;font-size:10px;background:#faeeda;color:#854f0b;padding:2px 8px;border-radius:20px;font-weight:600;border:1px solid #e9c06a}
.session-bd{padding:10px 12px;background:#fff}
.session-content{font-size:13px;color:#2a2a2a;line-height:1.6;margin-bottom:0}
.supplement-box{margin-top:8px;background:#fff8ee;border-radius:7px;padding:8px 10px;border-left:3px solid #e9c06a;display:flex;gap:8px;align-items:flex-start}
.supp-label{font-size:10px;font-weight:700;color:#854f0b;white-space:nowrap;margin-top:1px;letter-spacing:.02em;text-transform:uppercase}
.supp-text{font-size:12px;color:#5c3d10;line-height:1.5}
.session-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}
.small-btn{font-size:10px;padding:3px 9px;border-radius:6px;border:1px solid #d4cfc4;background:#fff;cursor:pointer;color:#6b7a70;font-weight:500;transition:all .12s}
.small-btn:hover{background:#f4f1eb}
.small-btn.del:hover{background:#faece7;border-color:#f5c4b3;color:#993c1d}
.empty-state{padding:40px 16px;text-align:center;color:#b0aa9e;font-size:13px}

/* No member */
.no-member{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#b0aa9e}
.no-member-icon{font-size:40px;opacity:.4;margin-bottom:4px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(20,30,22,.4);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:#fff;border-radius:14px;border:1px solid #e8e3d8;padding:22px 24px;width:460px;max-width:calc(100% - 32px);max-height:88vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.12)}
.modal-title{font-size:15px;font-weight:700;margin-bottom:18px;color:#1a1a1a}
.form-group{margin-bottom:13px}
.form-label{font-size:11px;font-weight:600;color:#6b7a70;margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.04em}
.form-label.accent{color:#ba7517}
.form-input{width:100%;padding:8px 11px;border:1px solid #d4cfc4;border-radius:8px;font-size:13px;background:#fff;color:#1a1a1a;font-family:inherit;transition:border .15s}
.form-input:focus{outline:none;border-color:#4a7c59}
.form-textarea{width:100%;padding:8px 11px;border:1px solid #d4cfc4;border-radius:8px;font-size:13px;resize:vertical;min-height:76px;background:#fff;color:#1a1a1a;font-family:inherit;line-height:1.5;transition:border .15s}
.form-textarea:focus{outline:none;border-color:#4a7c59}
.form-textarea.accent:focus{border-color:#e9c06a}
.radio-group{display:flex;gap:8px}
.radio-opt{display:flex;align-items:center;gap:6px;cursor:pointer;padding:8px 14px;border:1px solid #d4cfc4;border-radius:8px;flex:1;justify-content:center;font-size:13px;font-weight:600;transition:all .15s;color:#6b7a70}
.radio-opt:hover{border-color:#b0aa9e}
.radio-opt.sel-pro{border-color:#185fa5;background:#eef5fd;color:#185fa5}
.radio-opt.sel-trainer{border-color:#3b6d11;background:#eaf3de;color:#3b6d11}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.divider{height:1px;background:#e8e3d8;margin:4px 0 12px}
</style>
</head>
<body>

<div class="app" id="root"></div>

<script>
const ASSESSMENT_ITEMS = [
  {key:'static_posture',name:'Static Posture Assessment',cp:'Anterior / L-Lateral / Posterior / R-Lateral'},
  {key:'overhead_squat',name:'Overhead Squat',cp:'Ankle Inversion / Pelvic Rotation'},
  {key:'pelvic_tilt',name:'Pelvic Tilt',cp:'Anterior / Posterior Tilt'},
  {key:'pelvic_rotation',name:'Pelvic Rotation',cp:'Lt. / Rt.'},
  {key:'thoracic_rotation',name:'Thoracic Rotation',cp:'Lt. / Rt.'},
  {key:'slr_test',name:'SLR Test',cp:'Lt. / Rt. O.A / Shortness'},
  {key:'90_90_standing',name:'90/90 Test - Standing',cp:'Lt. / Rt.'},
  {key:'90_90_address',name:'90/90 Test - Address',cp:'Lt. / Rt.'},
  {key:'patrick_test',name:'Patrick Test',cp:'Ant. / Post.'},
  {key:'hip_extension',name:'Hip Extension Test',cp:'Ant. Tilt / Post. Tilt'},
  {key:'ql_palpation',name:'Q.L Palpation',cp:'Lt. / Rt.'},
  {key:'one_leg_bridge',name:'One Leg Bridge',cp:'Under 10s / 30s / Over 60s'},
  {key:'neck_palpation',name:'Neck Palpation',cp:'Cervical Curve / S.C.M / Scalene / U.Trap (Lt./Rt.)'},
  {key:'calf_palpation',name:'Calf Palpation',cp:'Bump / Achilles / Calf Palpation (Lt./Rt.)'}
];

const RESULT_OPTIONS = ['미검사','정상','경미한 제한','주의 필요','제한'];
const AVATAR_COLORS = ['av-green','av-blue','av-amber','av-coral'];

const SAMPLE_DATA = {
  members:[
    {id:'m1',name:'로버트',color:'av-green'},
    {id:'m2',name:'윤명숙',color:'av-blue'}
  ],
  assessments:{
    m1:{static_posture:{result:'정상',note:''},overhead_squat:{result:'정상',note:''},pelvic_tilt:{result:'정상',note:''},pelvic_rotation:{result:'정상',note:''},thoracic_rotation:{result:'경미한 제한',note:'우측 회전 제한'},slr_test:{result:'정상',note:''},'90_90_standing':{result:'정상',note:''},'90_90_address':{result:'경미한 제한',note:'어드레스 시 좌측 제한'},patrick_test:{result:'경미한 제한',note:''},hip_extension:{result:'정상',note:''},ql_palpation:{result:'정상',note:''},one_leg_bridge:{result:'정상',note:''},neck_palpation:{result:'정상',note:''},calf_palpation:{result:'정상',note:''}},
    m2:{static_posture:{result:'정상',note:''},overhead_squat:{result:'경미한 제한',note:'발목 내번'},pelvic_tilt:{result:'정상',note:''},pelvic_rotation:{result:'경미한 제한',note:''},thoracic_rotation:{result:'정상',note:''},slr_test:{result:'정상',note:''},'90_90_standing':{result:'정상',note:''},'90_90_address':{result:'정상',note:''},patrick_test:{result:'정상',note:''},hip_extension:{result:'정상',note:''},ql_palpation:{result:'정상',note:''},one_leg_bridge:{result:'정상',note:''},neck_palpation:{result:'정상',note:''},calf_palpation:{result:'정상',note:''}}
  },
  sessions:{
    m1:[
      {id:'s1',date:'2025-06-16',author:'정P',content:'스윙 중에 팔만 내리면서 몸회전을 안해서 문제 발생',supplement:'상하체 분리하는 힘 더 만들어주면 좋을 것 같습니다'},
      {id:'s2',date:'2025-06-17',author:'최T',content:'상하체 분리운동, 코어운동 진행',supplement:'스윙 시 왼어깨 들리면서 플레인이 바뀌는 느낌'},
      {id:'s3',date:'2025-06-23',author:'정P',content:'볼 포지션 수정 집중',supplement:''},
      {id:'s4',date:'2025-06-27',author:'최T',content:'스텝박스 리듬트레이닝, 플라이오메트릭 점프순발력트레이닝, 상체 푸쉬운동',supplement:''},
      {id:'s5',date:'2025-07-01',author:'최T',content:'발가락, 햄스트링 및 엉덩이 트레이닝',supplement:''},
      {id:'s6',date:'2025-07-08',author:'최T',content:'회전근개, 코어, 견갑골 안정화 및 어깨근육운동',supplement:''},
      {id:'s7',date:'2025-08-04',author:'정P',content:'하체랑 코어 연결시켜서 움직여주기',supplement:''}
    ],
    m2:[
      {id:'s8',date:'2025-06-25',author:'최T',content:'삼두근, 흉근, 코어근육 위주로 진행',supplement:'필드를 자주 나가서인지 팔로스루 때 왼쪽 어깨 앞면이 통증. 1달간 회복될 수 있도록 다른 방향의 운동 필요'},
      {id:'s9',date:'2025-07-01',author:'정P',content:'팔로우에서 넘어오는 힘을 만들어주는 동작',supplement:'상체로 비틀어내는 힘이 더 강하면 좋을 것 같습니다'},
      {id:'s10',date:'2025-07-05',author:'최T',content:'상체 코어운동, 어깨, 가슴, 삼두 기능성운동',supplement:''},
      {id:'s11',date:'2025-07-07',author:'정P',content:'템포 맞추면서 오른팔 내리는 공간 확보',supplement:''},
      {id:'s12',date:'2025-07-09',author:'최T',content:'전완, 이두, 등 근비대 견갑골 안정화운동',supplement:''},
      {id:'s13',date:'2025-07-14',author:'정P',content:'하체랑 상체 팔 싱크가 떨어져서 싱크에 집중',supplement:''},
      {id:'s14',date:'2025-07-22',author:'정P',content:'등이랑 팔안쪽 힘 강조하고 상하체 분리',supplement:'상하체 분리 힘이 조금 더 필요합니다'},
      {id:'s15',date:'2025-07-23',author:'최T',content:'상체 근력운동, 상하체 분리 훈련(케이블)',supplement:''},
      {id:'s16',date:'2025-07-29',author:'정P',content:'상하체 분리 동작 강조',supplement:'상하체 분리하면서 골반 기울기가 확보가 잘 안됩니다'}
    ]
  }
};

let S = {
  members:[],assessments:{},sessions:{},
  selectedMember:null,assessOpen:true,filterAuthor:'all',
  showAddSession:false,showAddMember:false,editSessionId:null,
  newSession:{date:today(),author:'정P',content:'',supplement:''},
  newMemberName:''
};

function today(){return new Date().toISOString().slice(0,10)}
function uid(){return 'm'+Date.now()+Math.random().toString(36).slice(2,5)}
function suid(){return 's'+Date.now()+Math.random().toString(36).slice(2,5)}
function initials(name){
  if(!name)return'?';
  const p=name.trim().split(/\s+/);
  if(p.length>=2)return p[0][0]+p[1][0];
  return name.slice(0,2);
}
function save(){
  try{localStorage.setItem('golf_pt_v2',JSON.stringify({members:S.members,assessments:S.assessments,sessions:S.sessions}))}catch(e){}
}
function load(){
  try{
    const d=localStorage.getItem('golf_pt_v2');
    if(d){const p=JSON.parse(d);S.members=p.members||SAMPLE_DATA.members;S.assessments=p.assessments||SAMPLE_DATA.assessments;S.sessions=p.sessions||SAMPLE_DATA.sessions;}
    else{S.members=SAMPLE_DATA.members;S.assessments=SAMPLE_DATA.assessments;S.sessions=SAMPLE_DATA.sessions;}
  }catch(e){S.members=SAMPLE_DATA.members;S.assessments=SAMPLE_DATA.assessments;S.sessions=SAMPLE_DATA.sessions;}
  if(S.members.length>0)S.selectedMember=S.members[0].id;
  render();
}
function stats(mid){
  const sess=S.sessions[mid]||[];
  return{total:sess.length,pro:sess.filter(s=>s.author==='정P').length,trainer:sess.filter(s=>s.author==='최T').length,supp:sess.filter(s=>s.supplement&&s.supplement.trim()).length};
}

function render(){
  const root=document.getElementById('root');
  const mid=S.selectedMember;
  const member=mid?S.members.find(m=>m.id===mid):null;
  const allSess=mid?(S.sessions[mid]||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)):[];
  const sessions=S.filterAuthor==='all'?allSess:allSess.filter(s=>s.author===S.filterAuthor);
  const assess=mid?(S.assessments[mid]||{}):{};
  const st=mid?stats(mid):null;

  root.innerHTML=`
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">NG</div>
      <div><div class="logo-text">내셔널짐</div><div class="logo-sub">Golf PT 협업</div></div>
    </div>
    <div class="sidebar-section-label">회원 목록</div>
    <div class="member-list">
      ${S.members.map(m=>`
        <div class="member-item${m.id===mid?' active':''}" onclick="selectMember('${m.id}')">
          <div class="member-avatar ${m.color}">${initials(m.name)}</div>
          <div class="member-name">${m.name}</div>
          <div class="session-badge">${(S.sessions[m.id]||[]).length}</div>
        </div>`).join('')}
    </div>
    <div class="add-member-btn" onclick="openAddMember()">+ 새 회원 등록</div>
  </div>

  <div class="main">
    ${member?`
    <div class="topbar">
      <div class="member-title-wrap">
        <div class="topbar-avatar ${member.color}">${initials(member.name)}</div>
        <div>
          <div class="member-title">${member.name} 회원님</div>
          <div class="member-subtitle">골프레슨 + 골프PT 패키지</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn primary" onclick="openAddSession()">+ 세션 기록</button>
      </div>
    </div>
    <div class="content">
      ${st?`
      <div class="stat-row">
        <div class="stat"><div class="stat-val">${st.total}</div><div class="stat-lbl">총 세션</div></div>
        <div class="stat"><div class="stat-val blue">${st.pro}</div><div class="stat-lbl">골프 레슨 (정P)</div></div>
        <div class="stat"><div class="stat-val green">${st.trainer}</div><div class="stat-lbl">골프 PT (최T)</div></div>
        <div class="stat"><div class="stat-val amber">${st.supp}</div><div class="stat-lbl">보완 요청</div></div>
      </div>`:''}

      <div class="section-card">
        <div class="section-header${S.assessOpen?' open':''}" onclick="toggleAssess()">
          <div class="section-label">
            <div class="dot dot-green"></div>
            체형 기능 평가
            <span class="sec-count">(${ASSESSMENT_ITEMS.filter(i=>{const v=assess[i.key];return v&&v.result&&v.result!=='미검사'}).length}/${ASSESSMENT_ITEMS.length})</span>
          </div>
          <div class="chevron">▼</div>
        </div>
        ${S.assessOpen?`
        <div class="assessment-grid">
          ${ASSESSMENT_ITEMS.map(item=>{
            const v=assess[item.key]||{result:'미검사',note:''};
            const warn=v.result&&v.result!=='정상'&&v.result!=='미검사';
            return`<div class="assess-item${warn?' warn':''}">
              <div class="assess-name">${item.name}</div>
              <div class="assess-cp">${item.cp}</div>
              <div class="assess-row">
                <select class="assess-select" onchange="updateAssess('${item.key}','result',this.value)">
                  ${RESULT_OPTIONS.map(o=>`<option value="${o}"${v.result===o?' selected':''}>${o}</option>`).join('')}
                </select>
              </div>
              <input class="assess-note-input" placeholder="특이사항" value="${(v.note||'').replace(/"/g,'&quot;')}" onchange="updateAssess('${item.key}','note',this.value)" />
            </div>`;
          }).join('')}
        </div>`:''}
      </div>

      <div class="section-card">
        <div class="section-header open" style="cursor:default">
          <div class="section-label">
            <div class="dot dot-amber"></div>
            세션 기록
            <span class="sec-count">(${sessions.length}건)</span>
          </div>
          <div class="section-right">
            <div class="filter-btn${S.filterAuthor==='all'?' active':''}" onclick="setFilter('all')">전체</div>
            <div class="filter-btn${S.filterAuthor==='정P'?' pro-active':''}" onclick="setFilter('정P')">정P</div>
            <div class="filter-btn${S.filterAuthor==='최T'?' trainer-active':''}" onclick="setFilter('최T')">최T</div>
          </div>
        </div>
        <div class="sessions-list">
          ${sessions.length===0?`<div class="empty-state">기록된 세션이 없습니다<br><span style="font-size:11px">상단 '+ 세션 기록' 버튼으로 추가하세요</span></div>`:
          sessions.map(s=>`
            <div class="session-card">
              <div class="session-hd ${s.author==='정P'?'pro':'trainer'}">
                <div class="role-tag ${s.author==='정P'?'pro':'trainer'}">${s.author==='정P'?'GOLF PRO':'GOLF PT'}</div>
                <div class="session-author">${s.author}</div>
                <div class="session-date">${s.date}</div>
                ${s.supplement?`<div class="supp-badge">보완요청</div>`:''}
              </div>
              <div class="session-bd">
                <div class="session-content">${s.content}</div>
                ${s.supplement?`
                <div class="supplement-box">
                  <div class="supp-label">보완점</div>
                  <div class="supp-text">${s.supplement}</div>
                </div>`:''}
                <div class="session-actions">
                  <button class="small-btn del" onclick="deleteSession('${s.id}')">삭제</button>
                </div>
              </div>
            </div>`).join('')}
        </div>
      </div>
    </div>
    `:`
    <div class="no-member">
      <div class="no-member-icon">⛳</div>
      <div style="font-size:14px;font-weight:600;color:#6b7a70">회원을 선택하세요</div>
      <div style="font-size:12px">좌측에서 회원을 클릭하거나 새 회원을 등록하세요</div>
    </div>`}
  </div>

  ${S.showAddSession?`
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-title">세션 기록 추가 — ${member?member.name+' 회원님':''}</div>
      <div class="form-group">
        <label class="form-label">날짜</label>
        <input type="date" class="form-input" value="${S.newSession.date}" onchange="updateNS('date',this.value)">
      </div>
      <div class="form-group">
        <label class="form-label">담당자</label>
        <div class="radio-group">
          <div class="radio-opt${S.newSession.author==='정P'?' sel-pro':''}" onclick="updateNS('author','정P')">
            <span>정P</span>&nbsp;<span style="font-size:11px;opacity:.7">골프 프로</span>
          </div>
          <div class="radio-opt${S.newSession.author==='최T'?' sel-trainer':''}" onclick="updateNS('author','최T')">
            <span>최T</span>&nbsp;<span style="font-size:11px;opacity:.7">골프 PT</span>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">운동 / 레슨 내용</label>
        <textarea class="form-textarea" placeholder="오늘 진행한 내용을 입력하세요" oninput="updateNS('content',this.value)">${S.newSession.content}</textarea>
      </div>
      <div class="divider"></div>
      <div class="form-group">
        <label class="form-label accent">보완점 <span style="font-weight:400;opacity:.7;text-transform:none">(상대 담당자에게 전달 — 선택사항)</span></label>
        <textarea class="form-textarea accent" style="border-color:#e9c06a;background:#fffbf2" placeholder="상대방이 보완해주면 좋을 내용 (비워도 됩니다)" oninput="updateNS('supplement',this.value)">${S.newSession.supplement}</textarea>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">취소</button>
        <button class="btn primary" onclick="addSession()">기록 저장</button>
      </div>
    </div>
  </div>`:''}

  ${S.showAddMember?`
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-title">새 회원 등록</div>
      <div class="form-group">
        <label class="form-label">회원 이름</label>
        <input class="form-input" placeholder="예: 김민수" oninput="S.newMemberName=this.value" autofocus>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">취소</button>
        <button class="btn primary" onclick="addMember()">등록</button>
      </div>
    </div>
  </div>`:''}
  `;
}

function selectMember(id){S.selectedMember=id;S.filterAuthor='all';render()}
function toggleAssess(){S.assessOpen=!S.assessOpen;render()}
function setFilter(f){S.filterAuthor=f;render()}
function openAddSession(){S.newSession={date:today(),author:'정P',content:'',supplement:''};S.showAddSession=true;render()}
function openAddMember(){S.newMemberName='';S.showAddMember=true;render()}
function closeModal(){S.showAddSession=false;S.showAddMember=false;render()}
function updateNS(k,v){S.newSession[k]=v}
function updateAssess(key,field,val){
  const mid=S.selectedMember;
  if(!S.assessments[mid])S.assessments[mid]={};
  if(!S.assessments[mid][key])S.assessments[mid][key]={result:'미검사',note:''};
  S.assessments[mid][key][field]=val;
  save();
}
function addSession(){
  const ns=S.newSession;
  if(!ns.content.trim()){alert('운동/레슨 내용을 입력하세요');return}
  const mid=S.selectedMember;
  if(!S.sessions[mid])S.sessions[mid]=[];
  S.sessions[mid].push({id:suid(),date:ns.date,author:ns.author,content:ns.content.trim(),supplement:ns.supplement.trim()});
  S.showAddSession=false;
  save();render();
}
function addMember(){
  const name=S.newMemberName.trim();
  if(!name){alert('이름을 입력하세요');return}
  const id=uid();
  const color=AVATAR_COLORS[S.members.length%AVATAR_COLORS.length];
  S.members.push({id,name,color});
  S.assessments[id]={};S.sessions[id]=[];
  S.selectedMember=id;S.showAddMember=false;
  save();render();
}
function deleteSession(id){
  if(!confirm('이 세션 기록을 삭제하시겠습니까?'))return;
  const mid=S.selectedMember;
  S.sessions[mid]=(S.sessions[mid]||[]).filter(s=>s.id!==id);
  save();render();
}

load();
</script>
</body>
</html>
