name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 그룹명을 pages → pages-v2 로 변경 (2026-08-08): 페이지즈 장애로 run #286이
# "pages" 그룹의 자리를 33시간째 점유해 후속 배포가 전부 막혔음. 새 그룹으로
# 우회해 신규 푸시가 즉시 배포되게 한다. cancel-in-progress 로 오래된 대기 run 정리.
concurrency:
  group: "pages-v2"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
